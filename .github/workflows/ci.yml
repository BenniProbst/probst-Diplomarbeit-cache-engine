name: probst-Diplomarbeit-cache-engine CI (REV 7.6 V11.7)

# Synchron mit .gitlab-ci.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  configure-code:
    name: cmake configure Diplomarbeit/Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure Code/
        run: cmake -S Code -B Code/build -G Ninja
      - name: Build messung-driver
        run: cmake --build Code/build --target comdare-messung-driver

  test-messung-driver:
    name: ctest test_messung_driver
    runs-on: ubuntu-latest
    needs: configure-code
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Configure + build tests
        run: |
          cmake -S Code -B Code/build-test -G Ninja
          cmake --build Code/build-test
      - name: Run ctest
        run: ctest --test-dir Code/build-test --output-on-failure -R test_messung_driver
