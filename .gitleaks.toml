# gitleaks-Konfiguration — probst-Diplomarbeit-cache-engine (Super, CI-Stufe lint:secrets, HART)
# Erweitert die Default-Regeln; allowlistet Submodule (Code/external/*), thesis/, Forschungs-/
# Build-/Archiv-Pfade — diese werden in ihren EIGENEN Pipelines geprüft bzw. sind Fremd-/Doku-Inhalte.
title = "probst-Diplomarbeit-cache-engine (Super) gitleaks"

[extend]
useDefault = true
# `generic-api-key` (entropie-basiert) wirft systematische False-Positives auf C++-Doku-Kommentaren;
# deaktiviert — die spezifischen High-Confidence-Regeln bleiben aktiv.
disabledRules = ["generic-api-key"]

[[allowlists]]
description = "Submodule + thesis + Fremd-/Doku-/Build-/Archiv-Pfade (keine echten Secrets im Super)"
paths = [
  '''(^|/)Code/external/''',
  '''(^|/)thesis/''',
  '''(^|/)Forschungsarbeiten/''',
  '''(^|/)_archive_code_pre_migration/''',
  '''(^|/)Code/build/''',
  '''(^|/)build/''',
  '''(^|/)build-[^/]+/''',
  '''(^|/)cmake-build-[^/]*/''',
  '''(^|/)\.citools/''',
  # ccache-Drop 17.08.: Kausalbefund Job 335274 am 27.07. selbentags widerlegt -- git clean
  # raeumt vor Scan, das Watchdog-Gewitter war die Wurzel; seit 10.08. deckelt zudem ein
  # 10-min-Timeout lint:secrets. Der '(^|/)\.ccache/'-Eintrag ist entfernt: .ccache-Pfade
  # werden MITGESCANNT, ein Fund dort ist ein echter Befund.
]

[[allowlists]]
description = "Test-Fixtures mit absichtlichen Pseudo-Schlüsseln"
regexTarget = "match"
regexes = [ '''(?i)(example|dummy|sample|test|fake|placeholder)[-_]?(key|token|secret|pw|password)''' ]

[[allowlists]]
# A2.5-FIX 14.08.: Scan-Ketten-Doktrin dokumentiert Koeder-Belege; d9ed8642 traegt zwei
# glpat-Koeder-Literale im COMMIT-TEXT (Praezedenz 'nur im Commit-Text, sonst Selbst-Trigger').
# Der lint:secrets-Job (dir-Modus) scannt Messages NICHT, die lokale Push-Wache (stdin-Modus
# ueber git log -p) SCHON -> diese Zeilen-Klasse entlastet NUR Zeilen, die das Token selbst
# als Koeder deklarieren ('Koeder' vor dem Token in derselben Zeile). Koeder sind per
# Doktrin Zufallswerte, nie echte PATs. Neue Commit-Texte fuehren Koeder MASKIERT.
description = "Deklarierte Koeder-Prosa: Wort 'Koeder' vor glpat-Token in derselben Zeile"
regexTarget = "line"
regexes = [ '''(?i)koeder[^\r\n]{0,80}glpat-[0-9a-zA-Z_-]{20}''' ]

# --- PROJEKT-DELTA (D6 #142, Owner-GO Block D 26.08.2026; Einbau 28.08.2026 im super-Lande-Zug) -------
# Nackte 32-/64-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als base64 nach Private-/Preshared-/
# Secret-Key-Wort bzw. als wg-quick-Konfigurationszeile. Anlass: der WireGuard-Private-Key in der
# super-Historie (0891fcf) wurde von KEINER Default-Regel ausser der hier deaktivierten, entropie-
# basierten generic-api-key gefangen (blinder Fleck). Regeln additiv ([extend] useDefault=true bleibt),
# kein Allowlist-Eingriff. Beleg des Entwurfs: 0 False-Positives ueber 12682 Commits/6 Historien
# (~/backups-workflow/20260825-public-gate/regelbeweis-*.log), Koeder-Suite 6/6 positiv, 0/5 negativ.
# Quelle: entwurf-gitleaks-regel-private-key-base64.toml (Bloecke woertlich uebernommen; byte-gleich zu ce
# .gitleaks.toml @ bd55942a, dort Einbau 27.08.2026 im ce-Lande-Zug).
[[rules]]
id = "private-key-base64-32byte"
description = """\
    Nackter 32-Byte-Schluessel (WireGuard/X25519/Ed25519/PSK) als 44-Zeichen-base64 nach 'Private \
    Key:', 'PrivateKey =', 'private_key=', 'PresharedKey ='"""
regex = """\
    (?i)(?:private[ _-]?key|privatekey|preshared[ _-]?key|presharedkey|psk)\\b\
    [^\\n\\r]{0,20}?[:=][ \\t]*[`'"]?([A-Za-z0-9+/]{43}=)(?:[`'"\\s,;)\\]}]|$)"""
secretGroup = 1
entropy = 4.0
keywords = ["private", "preshared", "psk"]

[[rules]]
id = "private-key-base64-64byte"
description = """\
    Nackter 64-Byte-Schluessel (Ed25519-Secret-Key libsodium, NaCl-Box-Paare) als 88-Zeichen-base64 \
    nach Private-Key-/Secret-Key-Wort"""
regex = """\
    (?i)(?:private[ _-]?key|privatekey|secret[ _-]?key|secretkey)\\b\
    [^\\n\\r]{0,20}?[:=][ \\t]*[`'"]?([A-Za-z0-9+/]{86}==)(?:[`'"\\s,;)\\]}]|$)"""
secretGroup = 1
entropy = 4.0
keywords = ["private", "secret"]

[[rules]]
id = "wireguard-conf-privatekey"
description = """\
    WireGuard-/wg-quick-Konfigurationszeile PrivateKey = / PresharedKey = (Datei-Form, auch ohne \
    Wort 'private' im Umfeld)"""
regex = '''(?m)^[ \t]*(?:PrivateKey|PresharedKey)[ \t]*=[ \t]*([A-Za-z0-9+/]{43}=)[ \t]*$'''
secretGroup = 1
entropy = 4.0
keywords = ["privatekey", "presharedkey"]
