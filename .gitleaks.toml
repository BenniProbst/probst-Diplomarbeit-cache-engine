# gitleaks-Konfiguration — probst-Diplomarbeit-cache-engine (Super, CI-Stufe lint:secrets, HART)
# Erweitert die Default-Regeln; allowlistet Submodule (Code/external/*), thesis/, Forschungs-/
# Build-/Archiv-Pfade — diese werden in ihren EIGENEN Pipelines geprüft bzw. sind Fremd-/Doku-Inhalte.
title = "probst-Diplomarbeit-cache-engine (Super) gitleaks"

[extend]
useDefault = true
# `generic-api-key` (entropie-basiert) wirft systematische False-Positives auf C++-Doku-Kommentaren;
# deaktiviert — die spezifischen High-Confidence-Regeln bleiben aktiv.
disabledRules = ["generic-api-key"]

[[allowlists]]
description = "Submodule + thesis + Fremd-/Doku-/Build-/Archiv-Pfade (keine echten Secrets im Super)"
paths = [
  '''(^|/)Code/external/''',
  '''(^|/)thesis/''',
  '''(^|/)Forschungsarbeiten/''',
  '''(^|/)_archive_code_pre_migration/''',
  '''(^|/)Code/build/''',
  '''(^|/)build/''',
  '''(^|/)build-[^/]+/''',
  '''(^|/)cmake-build-[^/]*/''',
  '''(^|/)\.citools/''',
  # ccache-Drop 17.08.: Kausalbefund Job 335274 am 27.07. selbentags widerlegt -- git clean
  # raeumt vor Scan, das Watchdog-Gewitter war die Wurzel; seit 10.08. deckelt zudem ein
  # 10-min-Timeout lint:secrets. Der '(^|/)\.ccache/'-Eintrag ist entfernt: .ccache-Pfade
  # werden MITGESCANNT, ein Fund dort ist ein echter Befund.
]

[[allowlists]]
description = "Test-Fixtures mit absichtlichen Pseudo-Schlüsseln"
regexTarget = "match"
regexes = [ '''(?i)(example|dummy|sample|test|fake|placeholder)[-_]?(key|token|secret|pw|password)''' ]

[[allowlists]]
# A2.5-FIX 14.08.: Scan-Ketten-Doktrin dokumentiert Koeder-Belege; d9ed8642 traegt zwei
# glpat-Koeder-Literale im COMMIT-TEXT (Praezedenz 'nur im Commit-Text, sonst Selbst-Trigger').
# Der lint:secrets-Job (dir-Modus) scannt Messages NICHT, die lokale Push-Wache (stdin-Modus
# ueber git log -p) SCHON -> diese Zeilen-Klasse entlastet NUR Zeilen, die das Token selbst
# als Koeder deklarieren ('Koeder' vor dem Token in derselben Zeile). Koeder sind per
# Doktrin Zufallswerte, nie echte PATs. Neue Commit-Texte fuehren Koeder MASKIERT.
description = "Deklarierte Koeder-Prosa: Wort 'Koeder' vor glpat-Token in derselben Zeile"
regexTarget = "line"
regexes = [ '''(?i)koeder[^\r\n]{0,80}glpat-[0-9a-zA-Z_-]{20}''' ]
