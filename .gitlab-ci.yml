# deshalb MINDESTENS ZWEI VERSCHIEDENE Job-Bloecke und wird rot, sobald einer wegfaellt.
# Der Selbstbiss misst genau diesen Eingang (Mutant M3: EINE Aufrufstelle weg, die andere bleibt).
