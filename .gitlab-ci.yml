# ── Stage submodules: air-gap-taugliche Submodul-Verdrahtung verifizieren (braucht recursive) ──
verify:submodules:
  extends: [.code-rules]   # #53: docs-only-Gate (faellt mit allen Code-Dependents; DAG bleibt gueltig)
  stage: submodules
  tags: [baremetal]
  needs: ["lint:secrets"]   # Codex-Review 06-27: hart auf den Secrets-Gate warten
  cache:
    paths: []               # #53: reine Submodul-Verifikation, kein Compile -> kein ccache-Zip
  script:
    - 'echo "== Submodule =="; git submodule status'
    - 'test -e Code/external/comdare-cache-engine/CMakeLists.txt && echo "cache-engine OK"'
    - 'test -e Code/external/comdare-prt-art/CMakeLists.txt && echo "prt-art OK"'
    - 'test -d thesis/diplomarbeit && (ls thesis/diplomarbeit/*.tex >/dev/null 2>&1 && echo "thesis-LaTeX OK" || echo "thesis vorhanden")'
    # REV-CI-04 (#22, 2026-07-13): Gitlink-Determinismus HART pruefen. `git submodule status` markiert mit
    # Praefix `-` (nicht initialisiert), `+` (ausgecheckter Commit != Gitlink) oder `U` (Merge-Konflikt). Mit
    # update=merge (.gitmodules) koennte CI auf einem persistenten/wiederverwendeten Worktree sonst einen
    # lokalen Mergezustand STATT des exakten Gitlink-Commits bauen (= misst evtl. den falschen Submodul-Stand).
    - |
      _bad="$(git submodule status --recursive | grep -E '^[-+U]' || true)"
      if [ -n "${_bad}" ]; then
        echo "FEHLER (REV-CI-04): Submodul NICHT auf exaktem Gitlink-Commit (-/+/U-Praefix):"; echo "${_bad}"; exit 1
      fi
      echo "Submodul-Gitlink-Determinismus OK (alle exakt auf ihrem Gitlink-Commit)"
    # PRAEVENTION Thesis-Doppelbindung (Paket b-ci-rueckschrieb-beide-zeiger, 2026-08-06). Das Thesis-Repo
    # ../20260931-overleaf-diplomarbeit.git ist in .gitmodules ZWEIMAL eingebunden (thesis/diplomarbeit Z. 45-50
    # LEBEND, Code/external/20260931-overleaf-diplomarbeit Z. 51-56 TOT). Die REV-CI-04-Wache darueber prueft nur
    # WORKTREE gegen GITLINK -- sie sieht nicht, ob die beiden GITLINKS untereinander auseinanderlaufen. Genau
    # das tat die CI bis zu diesem Paket selbst: anhang:forward bumpte nur den lebenden Zeiger. Diese Pruefung
    # faellt bei Divergenz ROT, BEVOR etwas darauf baut. Fail-closed: ein fehlender Pfad ist FEHLER, kein
    # Freifahrtschein -- die Begruendung steht im Kopf von ci/thesis_gitlink_parity.sh.
    - 'test -x ci/thesis_gitlink_parity.sh || { echo "FEHLER: ci/thesis_gitlink_parity.sh fehlt/nicht ausfuehrbar"; exit 1; }'
    - ci/thesis_gitlink_parity.sh --quelle head

