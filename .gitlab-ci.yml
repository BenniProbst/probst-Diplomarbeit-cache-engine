    # aber sie ist genau die Sorte Konstrukt, die man nicht mehr nachliest.
    - sh scripts/ci_abnahme06_bedingungs_tabelle.selbsttest.sh
    - sh scripts/ci_abnahme06_bedingungs_tabelle.sh --nur-zusicherung --gegen-vorlage docs/plaene/20260808-WELLENPLAN-ENDFASSUNG-v2-geschaerft-fable5.md

# ── Stufe 3: Test (aus ci-templates .test) — super-eigene Unit-Suite (11 Code/tests + 4 Stufen-Fixtures) ──
# User-Direktive 06.07.: strikt grün = Tests NIE manual/auslassen → automatisch + HART (kein allow_failure;
# lokal g++-bewiesen vor Scharfschaltung). Scope = Sammel-Target comdare_da_unit_tests + ctest -L da_unit —
# bewusst NICHT Target "all": das zöge die komplette ce-Suite (888 Targets) doppelt, die ihr EIGENES
# test:unit im ce-Repo hat (dort advisory bis 58er-Fix-Strecke/264-d).
test:unit:
  extends: [.test, .code-rules, .ccache-pull]   # #53: docs-only-Gate + ccache pull-only (Konsument)
  # OP-2 (D3-Plan, 27.07.; Herleitung korrigiert nach CiCheck-Messung 13570): die Vorlage .test aus
  # den zentralen ci-templates (base-pipeline.yml) bringt needs:[] mit -- test:unit war dadurch
  # stage-frei und startete in 4/4 gemessenen Voll-Wellen VOR verify:submodules (bis 37s Vorsprung),
  # d.h. die Unit-Suite baute los, bevor die Submodul-Verifikation ueberhaupt lief. Das needs hier
  # ueberschreibt das geerbte needs:[] und garantiert die Reihenfolge (Korrektheits-Fix, kein
  # Scheduling-Fix; test:unit liegt nicht auf dem kritischen Pfad der Welle).
  # EXISTENZ-SICHER in BEIDEN Richtungen: test:unit und verify:submodules ziehen ihre rules identisch
  # aus .code-rules => beide existieren in exakt denselben Wellen, das needs haengt nie.
  needs: ["verify:submodules"]
  tags: [baremetal]
  # -- GNU-BAUWEG (08.08.2026, Owner-Ansage; Ledger docs/DIPLOMARBEIT-...-LEDGER.md:11370-11391) --
  # DIESER JOB FAEHRT DEN OFFIZIELLEN WEG, NICHT MEHR cmake/ctest DIREKT -- sonst gibt es fuer
  # './configure.sh && make && make check' keine Wache und er verrottet unbemerkt. Genau das ist
  # run_all_tests.sh passiert (13x [NOT FOUND] und trotzdem exit 0).
  #
  # ZUR SORGE IM KOMMENTAR OBEN ("bewusst NICHT Target all: das zoege die komplette ce-Suite,
  # 888 Targets, doppelt") -- AM OBJEKT NACHGEMESSEN, sie trifft hier NICHT zu: 'make' (all) in
  # diesem Repo sind 218 Ninja-Schritte, davon 58 im ce-Unterbaum. Der Grund ist die bestehende
  # Naht: Code/CMakeLists.txt:211 zieht die ce per add_subdirectory(... EXCLUDE_FROM_ALL) ein, und
  # nur der Planer wird per EXCLUDE_FROM_ALL=FALSE gezielt ins ALL zurueckgeholt (Zeile 234). Die
  # ce-Suite haengt weiterhin NICHT am super-ALL und hat ihr eigenes test:unit im ce-Repo.
  #
  # Die Test-AUSWAHL ist unveraendert 'ctest -L da_unit' -- sie steht jetzt im Makefile statt hier.
  # CTEST_EXTRA reicht allein die Ausgabe-Option fuer den GitLab-Test-Report durch.
  script:
    - |
      set -euo pipefail
      _CC=cc; _CXX=c++
      if command -v gcc-15 >/dev/null 2>&1; then _CC=gcc-15; fi
      if command -v g++-15 >/dev/null 2>&1; then _CXX=g++-15; fi
      echo "GNU-Bauweg: CC=$_CC CXX=$_CXX"
      CC="$_CC" CXX="$_CXX" sh ./configure.sh --with-generator=Ninja \
        --with-build-type=Release \
        --enable-da-build-tests --enable-v32-enable --build-dir=Code/build-test
      _built=0
      for _a in 1 2 3 4; do
        if make BUILD_JOBS="${CMAKE_BUILD_PARALLEL_LEVEL:-4}"; then _built=1; break; fi
        echo "Bau-Versuch $_a fehlgeschlagen -> ninja-Resume-Retry"
      done
      [ "$_built" = 1 ] || { echo "FEHLER: 'make' nach 4 Versuchen nicht erfolgreich"; exit 4; }
      make check CTEST_EXTRA="--output-junit $(pwd)/ctest-junit.xml"
  variables:
    # Nur noch fuer die artifacts-Pfade des .test-Templates; das Bauverzeichnis setzt configure.sh.
    COMDARE_TEST_CMAKE_BUILD_DIR: "Code/build-test"

# ── D3-4 (2026-08-09, Owner-KERN): DIESELBE SUITE EIN ZWEITES MAL, IN DEBUG ──────────
# Der Owner woertlich: "Es waere SAUBERER IM CMAKE-DEBUG MODUS STANDARD GOOGLE TESTS ZU
# FAHREN UND DIESE IN RELEASE ZU WIEDERHOLEN AUFGRUND VON COMPILE REGRESSIONEN."
#
# DIE BEGRUENDUNG IST GEMESSEN, NICHT BEHAUPTET (09.08.): lokal baut build-xml mit
# CMAKE_BUILD_TYPE=LEER, also -O0; die CI faehrt Release, also -O3 -DNDEBUG. test_ms1
# war LOKAL GRUEN und fiel in Pipeline 15437 -- weil der Uebersetzer unter -O3 die
# Koeder-Allokationen als "nicht beobachtbar" ENTFERNTE (GCC -fallocation-dce,
# -fassume-sane-operators-new-delete). Der Zaehler war nie blind; er verfehlte genau die
# wegoptimierten Koeder. JEDE Beobachtbarkeits-Zusage ist unter -O0 SCHWAECHER als in der
# CI -- deshalb muessen dieselben Tests in BEIDEN Stufen laufen.
#
# ZWEI JOBS STATT EINES SEQUENTIELLEN LAUFS: eine Compile-Regression zeigt sich damit als
# GENAU EIN roter Job. Die Stufen-Attribution steht in der Pipeline-UI, nicht im Log-Grep.
# EIGENES BAUVERZEICHNIS (Code/build-test-debug): zwei Stufen im selben Baum
# ueberschrieben einander und die zweite Messung waere die erste.
# Ninja ist Single-Config -- 'ctest -C' griffe nur bei Multi-Config-Generatoren, und ein
# Generator-Wechsel risse configure.sh, Makefile und ccache um. Zwei Baeume sind hier der
# schwerere, aber offizielle Weg.
# KEIN allow_failure (Doktrin seit 06.07.: ZELLE = Warnung, JOB = hart rot).
test:unit:debug:
  extends: [.test, .code-rules, .ccache-pull]
  needs: ["verify:submodules"]
  tags: [baremetal]
  script:
    - |
      set -euo pipefail
      _CC=cc; _CXX=c++
      if command -v gcc-15 >/dev/null 2>&1; then _CC=gcc-15; fi
      if command -v g++-15 >/dev/null 2>&1; then _CXX=g++-15; fi
      echo "GNU-Bauweg (Debug): CC=$_CC CXX=$_CXX"
      CC="$_CC" CXX="$_CXX" sh ./configure.sh --with-generator=Ninja \
        --with-build-type=Debug \
        --enable-da-build-tests --enable-v32-enable --build-dir=Code/build-test-debug
      _built=0
      for _a in 1 2 3 4; do
        if make BUILD_JOBS="${CMAKE_BUILD_PARALLEL_LEVEL:-4}"; then _built=1; break; fi
        echo "Bau-Versuch $_a fehlgeschlagen -> ninja-Resume-Retry"
      done
      [ "$_built" = 1 ] || { echo "FEHLER: 'make' (Debug) nach 4 Versuchen nicht erfolgreich"; exit 4; }
      make check CTEST_EXTRA="--output-junit $(pwd)/ctest-junit.xml"
  variables:
    COMDARE_TEST_CMAKE_BUILD_DIR: "Code/build-test-debug"

# ── Stage orchestrate (REV13, #186 §5.4): Haupt-Pipeline zieht die 3 Modul-Pipelines synchron nach ──
# Jeder trigger startet die EIGENE Pipeline des Submodul-Projekts als downstream multi-project pipeline.
# strategy: depend = dieser Bridge-Job spiegelt den Kind-Pipeline-Status -> Super wird ROT, wenn ein Modul rot ist (= echtes Gate).
# needs: [lint:secrets] = erst nach Supers hartem Secrets-Gate triggern. Projektpfade aus .gitmodules (relative URLs -> comdare/research/<repo>).
trigger:cache-engine:
  stage: orchestrate
