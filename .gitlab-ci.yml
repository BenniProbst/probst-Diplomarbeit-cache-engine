# probst-Diplomarbeit-cache-engine (Super) — GitLab CI/CD (REV 13, 2026-06-27): Haupt-Pipeline orchestriert die 3 Modul-Pipelines (#186 §5.4); ci-templates-Lint + Mess→PDF
# ─────────────────────────────────────────────────────────────────────────────
# REV 10 (Debug-Befunde 6951 + User-Entscheidungen):
#  - Lint scannt NUR super-eigenen Code (GIT_SUBMODULE_STRATEGY:none je Lint-Job) — die Submodule
#    cache-engine/prt-art/thesis werden in IHREN Pipelines gelintet, nicht hier doppelt (schnell + keine Cross-FPs).
#  - analyse: KEIN Code/build/-Artefakt (Object-Storage-500 post-swap; Beleg = Build-Log). Mess-Daten via NAS-Writeback.
#  - thesis:pdf bis TeXLive-via-Infra (User-Wahl P1c) per Variable gegatet (sonst sicherer Fail an "latexmk fehlt").
#  - cache-engine-Mess-Artefakt-Fetch: job=pmc:amd (REV-10-Name), bleibt optionaler Fallback.
# Bewahrt den Mess→PDF-Flow (Submodule ziehen → Auswertungswerkzeuge bauen → Diplomarbeit-PDF mit REALEN Cache-Misses).

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - orchestrate          # REV13 (#186 §5.4): Haupt-Pipeline triggert die 3 Modul-Pipelines (strategy:depend = synchron + gated)
  - submodules
  - analyse
  - test                 # Stufe 3 (User 2026-07-03): VOLLE super-Unit-Suite bauen+AUSFUEHREN (Korrektheitsbeweis, nicht nur kompilieren)
  - integration
  - planer               # W7-A (§40.b): dynamische, Planer-gesteuerte Folge-CI (CiYamlBuilder -> Child-Pipeline), inert-by-default (opt-in COMDARE_DYNAMIC_PLANER_CI)
  - manifest             # Stufe 7 (#198, EPIC #186): Build-/Mess-Manifest (Provenance) + additives Prebackup
  - thesis-pdf
  - measure              # #156/#17 (User 2026-07-11): mehrtaegiger golden-320-Voll-Messlauf (inert-by-default, opt-in COMDARE_RUN_MEASURE)
  - persist              # #22 (Ledger §11-G): Auswertungs-Dokumente sammeln + commit-back nach development (inert-by-default)
                         # + anhang:forward (E-18, Ledger Sec-68c): der VORWAERTS-Kanal derselben Stage -- regenerierte
                         #   anhang/{de,en}/tabellen/*.tex nach Projekt 289 + Gitlink-Bump (inert-by-default)

# ── Submodul-Auth (REV 16, 2026-07-27, path a = nativer v8-Weg; Owner-GO Handout-1 §1 + INFRA->DIPLOM). ──
# Native GitLab-Submodul-Verdrahtung statt manuellem Klon: GIT_STRATEGY:fetch + GIT_SUBMODULE_STRATEGY:recursive
# (unten in variables:) -> get_sources klont die 3 Submodule (ce/prt-art/thesis) rekursiv und injiziert das
# CI_JOB_TOKEN automatisch via `http.<host>.extraheader`. Die .gitmodules-URLs sind relativ (super 89af7ca2)
# -> same-host gegen origin aufgeloest; GIT_SUBMODULE_FORCE_HTTPS erzwingt HTTPS (air-gap). Voraussetzung =
# inbound-job_token_scope-Allowlist von 289/287/286 enthaelt 288 (verifiziert 2026-07-27; #399 + Recheck).
#
# SUPERSEDED (REV 13/14 insteadOf; REV 15/17 manueller Deploy-Token-Klon im default:before_script): der
# REV-15-Behelf war noetig, solange v7.0.3-Embed-Tokens + polluted Host-gitconfigs den Runner-extraheader mit
# einem FREMDEN Token verunreinigten (403 job-token). Seit v7.0.4 (kein Embed-Token) + Host-Store-De-Pollution
# + GIT_CONFIG-per-Build-Isolation (#395) injiziert der Runner den KORREKTEN CI_JOB_TOKEN -> der native
# recursive-Fetch traegt; der manuelle Deploy-Token-Klon entfaellt ersatzlos.
# Jobs OHNE Submodul-Bedarf ueberschreiben GIT_SUBMODULE_STRATEGY:none (lint:*/persist:measurements/
# ergebnis:holen) bzw. GIT_STRATEGY:none (toolchain:probe/runner:sweep-zombies). ci-templates unberuehrt.

# #277/#21 (User 06.07.): ccache-Bestand liegt auf dev-MinIO (runners.cache -> minio.comdare.de:9000/buildsystem-cache).
# CCACHE_DIR projektlokal, damit GitLab-cache ihn synct; MAXSIZE klein halten (Zip-Transfer je Job).
cache:
  key: "ccache-$CI_PROJECT_NAME"
  paths: [".ccache"]

variables:
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  CCACHE_MAXSIZE: "3G"
  COMDARE_CLANG_MATRIX: "1"   # #273: neueste-clang-Pflicht (User-E2), Rollout-Start super
  GIT_STRATEGY: fetch                      # (REV 16, path a) natives Repo-Setup -> get_sources injiziert CI_JOB_TOKEN via extraheader
  GIT_SUBMODULE_STRATEGY: recursive        # (REV 16, path a) nativer rekursiver Submodul-Fetch mit CI_JOB_TOKEN (ersetzt den manuellen Deploy-Token-Klon)
  GIT_SUBMODULE_FORCE_HTTPS: "true"        # relative URLs -> GitLab-HTTPS + CI_JOB_TOKEN (air-gap)
  # DIESER WERT WIRKT GLOBAL, ALSO IN JEDEM BAU-JOB. Der Spitzenbedarf ist deshalb
  # (Jobs gleichzeitig) x (dieser Wert) x (Speicher je Uebersetzer) -- ein Produkt aus
  # drei Zahlen, die in drei verschiedenen Systemen stehen.
  # KORREKTUR 10.08.2026 (Owner-Auftrag "mal schauen, ob nicht dort speicher eingespart
  # sein kann"): die alte Begruendung "2x6 Kerne bei concurrent=2" war seit der
  # Runner-Umstellung FALSCH. /usr/local/sbin/runner-mode.sh:43 setzt im Normalbetrieb
  # NORMAL_CC=4 auf prod1 UND prod2 -- vier Jobs gleichzeitig, nicht zwei. Der Ansatz war
  # damit um den Faktor 2 zu klein gerechnet, ohne dass etwas rot wurde.
  # GEMESSEN am selben Tag (26 TUs von 635, /usr/bin/time -v, Release-Flags aus
  # compile_commands.json): groesste TU 660 MB, Permutations-TUs Median 580 MB.
  # 4 x 6 x 660 MB = 15840 MB Spitze gegen rund 24576 MB, die auf prod1 dafuer frei sind.
  # DER WERT BLEIBT BEI 6 -- das Budget haelt. Was sich aendert: es wird jetzt GEPRUEFT.
  # Die Wache ist Code/tests/unit/test_ci_wache_speicherbudget.cpp (ctest -L ci_wachen);
  # sie faellt, wenn dieser Wert, der ce-Zwilling oder die Runner-Annahme auseinanderlaufen.
  # Ein Kommentar konnte das nie -- er hat drei Wochen lang das Falsche behauptet.
  CMAKE_BUILD_PARALLEL_LEVEL: "6"
  COMDARE_LINT_PATHS: "Code"
  COMDARE_LINT_EXCLUDE_RE: "(^|/)(ext|build|_archive_code_pre_migration|cmake-build-[^/]*|modules|external|thesis)/"
  # cppcheck-Pendant zur EXCLUDE_RE (Template 237b6ec): OHNE external/thesis scannt lint:static die
  # Submodule mit, die auf dem persistenten Workspace aus recursive-Jobs liegen (Job 192672).
  COMDARE_CPPCHECK_IGNORE_DIRS: "ext build _archive_code_pre_migration modules external thesis"
  # S1/A1 P-TOTAL (Ledger 46/48): Voll-Build-Umfang 2^17 des all_axes_golden-Organraums. Selbst-enthaltene
  # Child-/Grandchild-Pipelines erben Pipeline-Variablen NICHT -> dieser Wert wird ueber die zwei Trigger-Grenzen
  # (planer:delegate-trigger + der CE-emittierte ceb:trigger) per expliziter forward-Allowlist durchgereicht, damit
  # der Grandchild-Tier-Bau 131072 statt des Sicherheits-Fallbacks 16 liest. Golden-neutral (reiner CI-Umfang).
  # Ueberschreibbar je Trigger (z.B. Kalibrierlauf COMDARE_GN_TOTAL=64); wirkt nur hinter COMDARE_BUILD_GOLDEN_N.
  COMDARE_GN_TOTAL: "131072"

# ── #53 docs-only-Durchsatz-Gate (Ledger §63-Nachtrag, Manager-Verdikt V2): Allowlist-Rules-Vorlage. ──
# WIRKT auf development (unsere docs-/Ledger-Wellen SIND development-Pushes): ein Commit, der NUR
# Dokumentation aendert (KEIN Pfad der changes-Allowlist), ueberspringt die schweren Code-Jobs =>
# sofortiger Durchsatz-Gewinn. Fuer die CODE-Jobs laeuft main weiter IMMER voll (der main-Zweig DIESER
# Vorlage bleibt bestehen: Release-Beweis auf der Merge-SHA; V2). P2/D3.1 (27.07.) nimmt diese main-Ausnahme
# aber den 3 orchestrate-BRIDGES: die sind jetzt auch auf main changes-gegatet, damit eine docs-only-Welle
# auf main keine Modul-Pipelines mehr erzeugt (Ende der 286-Echo-Kaskade). Gitlink-
# Bumps (Code/external/*, .gitmodules) stehen in der Positivliste => ein 1-Zeilen-160000-Submodul-Bump ist
# NIE docs-only. Allowlist (NICHT Blocklist): neue Branches/unbekannte Pfade => changes=true = volle
# Pipeline (sichere Richtung). web/pipeline/trigger/MR werten changes ohnehin true bzw. sind Mess-Trigger
# => nie gaten. lint:secrets bleibt UNGEGATET (Token-Risiko je Commit); thesis:pdf ist docs-Konsument.
# Doktrin-Auslegung (V2): "gesamte Pipeline hart gruen" bezieht sich auf den CODE-Stand -- ein docs-only-
# Commit aendert keinen Code, der Beweis der Vorwelle bleibt gueltig (Skip != gelb, Job existiert nicht).
.code-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - changes:
        paths:
          # GNU-Bauweg (08.08.2026): die drei Wurzeldateien SIND Bau-Code, auch wenn kein C++
          # drinsteht. Sie fehlten hier zunaechst -- Folge, live beobachtet an Pipeline 15317
          # (sha 0e32a07c): der Commit, der configure.sh und Makefile EINFUEHRTE, loeste 3 von 14
          # Jobs aus, build:clang lief gar nicht, und die Pipeline war gruen, weil nichts geprueft
          # wurde. Ein Bauweg ohne Wache ist derselbe Fall wie run_all_tests.sh: er verrottet
          # unbemerkt. Wer diese Dateien anfasst, weckt ab jetzt die vollen Code-Jobs.
          - "configure.sh"
          - "Makefile"
          - "Code/**/*"
          - "Code/external/*"      # Gitlink-Bumps ce/prt-art (1-Zeilen-160000-Diff) => NIE docs-only
                                   # deckt AUCH Code/external/20260931-overleaf-diplomarbeit ab (2. Thesis-
                                   # Gitlink, .gitmodules Z. 51-56) -> ein Bump NUR dort weckt verify:submodules
                                   # und damit die Paritaets-Pruefung; die Praevention hat hier keine Luecke.
          - "thesis/diplomarbeit"  # thesis-Gitlink (der LEBENDE der beiden)
          - ".gitmodules"
          - ".gitlab-ci.yml"
    - when: never

# ── #53 ccache-Hygiene: Konsumenten ziehen den ccache nur (policy: pull), EIN Writer (analyse:thesis-data)
# bleibt pull-push (globale cache-Default). Nicht-kompilierende Jobs tragen KEINEN ccache-Zip-Transfer. ──
.ccache-pull:
  cache:
    key: "ccache-$CI_PROJECT_NAME"
    paths: [".ccache"]
    policy: pull

# ── Stufe 1: Lint (aus ci-templates) — NUR super-eigener Code, KEINE Submodule ──
# #273 T1 (User-E2 2026-07-05): Compiler-Inventar je Runner-Host via CI (Cluster read-only) — Grundlage
# fuer den gcc-15.3-Pin (T2) + die neueste-clang-Pflichtmatrix. Rollout beginnt hier (super).
# [RUN-1]-Workaround selbstbedienbar (User-GO 22.07. "kill alle Zombies"): Job-Cancel laesst den
# comdare-messung-driver als Waise zurueck (Runner killt nur den Shell-Wrapper) -> P11-Wache blockt
# den Host. Dieser Sweep laeuft ALS gitlab-runner auf der per SWEEP_TAG gewaehlten Lane und darf die
# eigenen Waisen killen. NUR via API-Trigger mit COMDARE_SWEEP_ZOMBIES=true + SWEEP_TAG=amd|intel.
# Nachhaltig-Fix (Runner KillMode/Prozessgruppen) bleibt Infra-Task [RUN-1].
runner:sweep-zombies:
  stage: lint
  tags: ["$SWEEP_TAG"]
  needs: []
  cache:
    paths: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$COMDARE_SWEEP_ZOMBIES == "true"'
  script:
    # [c]-Trick auf ALLEN Mustern (12097-Befund 2026-07-22): das nackte Muster matcht jede fremde Shell,
    # deren Cmdline den String traegt (Monitor-/eval-Shells) -> Verifikation exit 1 trotz erfolgreichem Kill.
    # Die Regex [c]omdare... matcht den echten Treiber, aber nie eine Cmdline, die das Muster selbst zitiert.
    - 'echo "== Waisen-Inventar ($SWEEP_TAG / $(hostname)) =="'
    - 'pgrep -af ''[c]omdare-messung-driver'' || echo "keine Waisen"'
    - 'pkill -f ''[c]omdare-messung-driver'' 2>/dev/null || true'
    - 'sleep 3'
    - 'pkill -9 -f ''[c]omdare-messung-driver'' 2>/dev/null || true'
    - 'sleep 2'
    - 'echo "== ps-Beleg nach Sweep =="'
    - 'pgrep -af ''[c]omdare-messung-driver'' && exit 1 || echo "SAUBER: keine comdare-messung-driver-Prozesse auf $(hostname)"'

toolchain:probe:
  extends: [.toolchain-probe, .code-rules]   # #53: docs-only-Gate
  tags: [baremetal]
  cache:
    paths: []                                # #53: Probe kompiliert nicht -> kein ccache-Zip-Transfer

# #273: Pflicht-Build mit dem neuesten auf dem Host verfuegbaren clang (COMDARE_CLANG_MATRIX=1 oben).
# #258-Fix (2026-07-06, Pipeline 8048/Job 213091): Template-Default cmake -S "." fand kein CMakeLists —
# super-Quelle liegt unter Code/. Scope = Sammel-Target comdare_da_tools (Code/CMakeLists.txt, super-eigene
# Werkzeugflaeche analog analyse+integration; Konfiguration spiegelt analyse:thesis-data: Ninja/Release/V32).
build:clang:
  # #53: docs-only-Gate als EXPLIZITE kombinierte rules (NICHT .code-rules-extends), damit der #273-CLANG_MATRIX-
  # Ausschalter erhalten bleibt (architekturkonform, nicht nur heute-identisch): CLANG_MATRIX!=1 => never (Bestand
  # der neueste-clang-Pflicht), DANN die V2-Allowlist (docs-only skippt; main/Code/Gitlink laufen). .ccache-pull
  # bleibt (Konsument, pull-only).
  # P2/D3.1 (27.07.; INFRA-AN-DIPLOM Punkt 1 SUPERSEDET das alte "needs UNVERAENDERT (Verdikt V4)"):
  # ohne needs war der Job stage-blockiert (stage: analyse) und wartete hinter der Stage orchestrate
  # auf die 3 strategy:depend-Bridges -- Slot-Fresser und Mit-Ursache der 286-Echo-Kaskade. Mit
  # needs: ["verify:submodules"] laeuft er per DAG los, sobald die Submodul-Verifikation steht.
  # EXISTENZ-SICHER in der TRAGENDEN Richtung: die rules 2-4 unten sind eine echte Teilmenge der
  # .code-rules (Vorlage oben), also existiert verify:submodules in JEDER Welle, in der build:clang
  # existiert => das needs haengt nie. Die Gegenrichtung gilt bewusst NICHT: mit
  # COMDARE_CLANG_MATRIX != "1" existiert verify:submodules OHNE build:clang -- fuer die
  # needs-Validitaet harmlos (nur die tragende Richtung zaehlt).
  extends: [.build-clang-latest, .ccache-pull]
  needs: ["verify:submodules"]
  rules:
    - if: '$COMDARE_CLANG_MATRIX != "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - changes:
        paths:
          - "Code/**/*"
          - "Code/external/*"
          - "thesis/diplomarbeit"
          - ".gitmodules"
          - ".gitlab-ci.yml"
    - when: never
  stage: analyse   # super hat keinen 'build'-Stage (Lint-API 05.07.: chosen stage build does not exist)
  tags: [baremetal]
  variables:
    COMDARE_CMAKE_SOURCE_DIR: "Code"
    COMDARE_AUDIT_BUILD_TYPE: "Release"
    COMDARE_CMAKE_CONFIGURE_FLAGS: "-G Ninja -DCOMDARE_V32_ENABLE=ON"
    COMDARE_CMAKE_BUILD_TARGET: "comdare_da_tools"

lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
  # #53-Haertung (21.07.): explizite Immer-rules — lint:secrets ist der EINZIGE Pflicht-Job jeder Welle
  # (Token-Risiko je Commit, auch docs-only). Befund 12012: docs-only-Welle entstand LEER-failed; diese
  # rules stellen sicher, dass die Minimal-Welle existiert und GRUEN werden kann.
  rules:
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:format:
  extends: [.lint-format, .code-rules]   # #53: docs-only-Gate (Tool-Cache aus .lint-format bleibt)
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
lint:static:
  extends: [.lint-static, .code-rules]   # #53: docs-only-Gate (Tool-Cache aus .lint-static bleibt)
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none

# --- Stufe 1e: Diff-Hygiene (ASCII + Spaltenbreite) -- super-eigene Wache, 2026-08-06 ---
# WARUM DIESER JOB EXISTIERT: der super hatte KEINE eigene ASCII-/Breiten-Wache. Nachgemessen:
#   git ls-files | grep -vE '^Code/external/' | grep -iE 'ascii|width|guard|wache'
# lieferte kein einziges Pruefwerkzeug (nur C++-Quellen mit "guard" im Namen und archivierte Logs);
# ein Verzeichnis scripts/ gab es im super gar nicht. Die super-Pakete dieser Session wurden mit dem
# Skript des FREMDEN ce-Repos geprueft. Zweiter Beleg im super-eigenen Code: Code/tests/CMakeLists.txt
# verweist woertlich auf "(scripts/ci_diff_ascii_width_guard.sh)" -- ein Pfad, den es hier nicht gab.
#
# WAS DIE BESTEHENDEN LINT-JOBS NICHT ABDECKEN (gemessen, nicht vermutet -- clang-format 22.1.8
# gegen die super-eigene .clang-format):
#   * eine 140 Spalten lange, REIN ASCII-Kommentarzeile  -> clang-format Exit 0 (durch),
#     weil die .clang-format ReflowComments: false setzt. Im Bestand: 15 solche Zeilen in
#     .cpp/.hpp, die lint:format heute scannt und passieren laesst.
#   * ein String-Literal mit echten Umlauten             -> clang-format Exit 0 (durch).
#     ASCII prueft ueberhaupt kein bestehender Job.
#   * Datei-Scope: lint:format/lint:static sehen nur \.(c|cc|cxx|cpp|h|hh|hxx|hpp)$ -- weder
#     .cmake noch CMakeLists.txt noch .sh. Der ins Leere zeigende Verweis oben steht in einer
#     CMakeLists.txt, also genau ausserhalb dieses Scopes.
#
# WARUM GIT_DEPTH: 0 -- die Wache bestimmt ihren Bereich per `git merge-base` SELBST und nimmt
# bewusst KEINEN uebergebenen Zwischen-SHA entgegen (CI_COMMIT_BEFORE_SHA & Co. sind aktiv
# verboten, Exit 2): ein zu eng geschnittener Bereich hat in dieser Session 61 Prozent einer
# Aenderung verborgen. merge-base braucht echte Historie; ein flacher Klon laesst sie scheitern --
# und die Wache bricht dann FATAL ab statt still gruen zu werden.
#
# WARUM rules: when: on_success (wie lint:secrets) -- die Wache soll bei JEDEM Lauf greifen, auch
# in einer docs-only-Welle. Sie wird dort nicht "still gruen": sie druckt ihren NENNER
# ("N Zeilen geprueft, davon 0 Nicht-ASCII") und benennt die uebersprungenen Dateien.
#
# WARUM KEIN allow_failure -- eine advisory Wache ist die naechste stille Null. Der Bereich ist
# in der Praxis klein (nur noch nicht gelandete Commits gegen origin/$CI_DEFAULT_BRANCH), der
# Alt-Bestand wird bewusst NICHT geprueft: `--bestand` meldet heute 845 Nicht-ASCII- und
# 174 Breiten-Zeilen aus 18714: eine Bestands-Wache waere am Tag ihrer Einfuehrung rot geboren.
# Diese Wache stoppt NEUE Verstoesse, sie saniert keine alten.
#
# KEIN extends: .lint-base -- der Job braucht nur git und awk, keine .citools-Werkzeuge und
# damit auch keinen Tool-Cache.
lint:diff-hygiene:
  stage: lint
  tags: [baremetal]
  needs: []
  cache:
    paths: []
  rules:
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: none   # super-eigener Diff; das ce lintet in SEINER Pipeline
    GIT_DEPTH: 0                   # merge-base braucht Historie -- flacher Klon => FATAL, nie still gruen
    COMDARE_GUARD_BASIS_REF: "origin/$CI_DEFAULT_BRANCH"
  script:
    - sh scripts/ci_diff_ascii_width_guard.sh --seit-basis
    # ZWEITE, UNABHAENGIGE AUFRUFSTELLE der Registrierungs-Wache (P4c, 2026-08-09).
    # Sie steht bewusst in einem Job einer ANDEREN Familie: ihr eigener Job
    # (test:tests-registrierung) laesst sich mitloeschen, dieser hier nicht im selben
    # Griff. Faellt eine der beiden Stellen weg, wird die Wache ueber ihre Regel R2 rot.
    # Hier OHNE --selbstbiss: der Mutationsbeweis kostet vier Zusatzlaeufe und gehoert
    # in den eigenen Job; hier zaehlt nur, dass die Wache ueberhaupt noch gerufen wird.
    - sh ci/tests_registrierung_wache.sh

# XML-WOHLGEFORMTHEIT (2026-08-08): am 08.08. war Code/experiment_config/messreihen.xml -- das
# Standard-Template der Messreihen -- nicht wohlgeformt, zusammen mit vier weiteren XML im ce.
# Fehlerklasse: "--" INNERHALB eines XML-Kommentars (von XML 1.0 Abschnitt 2.5 ausnahmslos
# verboten); hier zweimal ein CLI-Flag, das im Kommentar als Aufruf-Beispiel stand. Nichts hat es
# gemeldet. Die vorhandene XML-Maschinerie (Code/tests/xml_canonical_utils.cmake) liest zwar ueber
# xmllint, bedient aber GENAU ZWEI Fixture-Wachen mit fest benannten Dateien -- messreihen.xml kam
# in ihrer Liste nicht vor. Diese Wache hat keine Liste, sie fragt git nach dem Bestand.
# Sie loest zugleich eine dort notierte Auflage ein: xmllint war "bis heute in KEINEM CI-Job dieses
# Repos aufgerufen", seine Praesenz auf den Runnern also unbelegt. Dieser Job ist der erste, der es
# anfasst -- fail-closed gebaut, fehlt das Werkzeug wird er ROT (rc=2) und nennt das Paket.
# KEIN extends: .lint-base -- der Job braucht nur git und xmllint, keine .citools-Werkzeuge.
# KEIN .code-rules -- XML aendert sich auch in docs-only-Commits, die Wache muss immer laufen.
lint:xml-wellformed:
  stage: lint
  tags: [baremetal]
  needs: []
  cache:
    paths: []
  rules:
    - when: on_success
  variables:
    GIT_SUBMODULE_STRATEGY: none   # super-eigener XML-Bestand; das ce prueft seinen in SEINER Pipeline
  script:
    - sh scripts/ci_xml_wellformed_guard.sh

# -- D3-4 (2026-08-09): PROBE fuer die XML-WOHLGEFORMTHEITS-WACHE, die Wache wird selbst geprueft --
# Die Wache darueber (lint:xml-wellformed) war ungedeckt. Ihr VERSCHWINDEN als Datei faengt `sh` mit
# rc=127 ab, der Job wird rot -- ungedeckt war ausschliesslich ihre AUFWEICHUNG: faellt ein `exit`
# aus ihr heraus, sagt sie weiter "OK", und nichts meldet es. Genau die Fehlerklasse, gegen die sie
