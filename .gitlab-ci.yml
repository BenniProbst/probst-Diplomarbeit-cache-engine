          tail -n +2 "$rc" >> "$WIDE"
        done < measure_out/_rc_list.txt
        if [ -s "$WIDE" ] && [ "$(wc -l < "$WIDE")" -gt 1 ]; then
          "$APP" "$WIDE" measure_out/appendix --langs=de,en || echo "appendix-generator: honest-empty/Teil-Output (n/a-Spalten) — kein Fehler"
          echo "== regenerierte Anhang-.tex =="; find measure_out/appendix -name '*.tex' 2>/dev/null | wc -l | xargs echo "  Anhang-.tex je Lauf:"
          rm -f "$WIDE" measure_out/_rc_list.txt   # Intermediates (39k-Zeilen-Konkatenation) NICHT artefakten/persistieren — das per-Perm-Rohmaterial reicht
        else
          echo "kein WIDE-Aggregat (keine result.csv gefunden) -> Anhang-Regenerierung honest uebersprungen"
        fi
      fi
      echo "=== measure:golden-320 OK (golden-320 gemessen; CSVs + regenerierter Anhang unter measure_out/) ==="
  artifacts:
    paths:
      - Code/measure_out/**/*.csv          # NUR die Mess-CSVs (Ergebnisse) — NICHT die ~320 DLL-Binaries (Repo-/Artefakt-Bloat)
      - Code/measure_out/appendix/**/*.tex # CI-interaktiv (#24): die aus Live-Messdaten regenerierten 12 Kern- + 5 Darstellungs-.tex
    when: always
    expire_in: 12 weeks

# ── Stage measure — GN-3 / §33 (User 2026-07-19): der INERTE CI-BAU-BEWEIS-Job des NEW-GOLDEN-Systembeweises.
#    §33-Doktrin: golden-320 ist KEIN legitimer Systembeweis (13 von 17 Achsen gepinnt); NUR der new-golden-Satz
#    unter VOLL-Konfiguration (all_axes_golden.profile.xml: ALLE 17 Achsen je 2 Auspraegungen, N=2^17=131072, PLUS
#    <system_axes> opt O2/O3 x simd no_extension/avx2) beweist das System. Dieser Job faehrt den auf der CI
#    ausfuehrbaren PRE-FLIGHT-Beweis-Schritt: comdare-messung-driver --validate gegen das VOLL-Konfig-Profil ->
#    das N-XML parst + validiert HART gegen die realen EnabledStrategies (17x2 Organ-Werte) UND die
#    System-Achsen-Klassen (opt O0..O3 zulaessig / Ofast REJECT gemaess §32-F4, simd gegen die SimdSubAxis-Optionen).
#    Das ist der auf der CI ausfuehrbare Teil der F2-Aufbau-Doktrin ("System gegen die CI mit dem new-golden-Satz
#    aufbauen"). tags [prod,baremetal,amd] = PMC-Node prod1 (wie die measure-Jobs).
#    INERT-by-default: der Job wird GAR NICHT erzeugt, solange nicht COMDARE_BUILD_GOLDEN_N=="true" gesetzt ist —
#    der Gesamtlauf (Messung/Bau AUS) baut ihn also NIE. KEIN Messlauf, KEIN Storage-Drop -> golden-neutral.
#
#    FIXME (INC-G6, Materialisierungs-Increment — GO-pflichtig, NICHT golden-neutral, NICHT in diesem Job): die
#    VOLLE Materialisierung des 2^17-DLL-Katalogs ("System aufbauen" im Wortsinn) steht noch aus. Sie ist bewusst
#    NICHT Teil dieses Jobs, weil 131072 materialisierte Quell-TUs ein GB-Compile / g++-ICE waeren — der GN-2-Guard
#    (source_catalog.hpp: negativer Instanziierungs-Guard an der Katalog-Naht) sperrt die materialisierende Naht
#    compile-time. Der Systembeweis-ANKER ist heute der COMPILE-TIME-Beweis in der ce-Test-Suite:
#    static_assert(catalog_axis_product<FullSourceCatalog>() == 131072) + CRC64 kNewGolden131072Crc64 =
#    0xF1C1F26A1232073B (source_catalog.hpp) + test_reflect_versions_all17. Sobald INC-G6 gebaut ist
#    (gestaffelte/Storage-gated Materialisierung + provision-only-Treiber-Pfad), erweitert er DIESEN Job um den
#    echten N-Satz-Bau; bis dahin ist der --validate-Pre-Flight der ausfuehrbare Beweis-Schritt.
# .golden_n_build (W4-A / Ledger §35+§36, 2026-07-19): das gemeinsame Geruest der Cluster-parallelen System-Achsen-Builds.
#   parallel:matrix ueber msys x opt x simd x chunk (je Zelle EIN Job); 3-stufiges N-Node-Capability-Routing per
#   Runner-Tag ($GN_RUNNER_TAG, §36.3); LOCKING via resource_group (§36.1); Cross-Runner-Dedup (Ein-Build-pro-
#   Permutation, egal wo) via MinIO-Chunk-Marker + algo_sig-Invalidierung (#50) als 2. Schicht.
#   Zwei konkrete Jobs erben dies (DRY: EIN script, zwei Matrizen):
#     build:golden-n         -> no_extension (Tag amd64, ALLE amd64-Nodes) + avx2 (Tag avx2), §33-Kernsatz
#     build:golden-n-avx512  -> avx512 (Tag avx512, heute nur prod1/Zen5), extra opt-in
.golden_n_build:
  stage: measure
  interruptible: false              # INC-G6/Ledger-34: der N-Bau (Stufe 2) darf NIE auto-cancelt werden (Belt-and-Suspenders zu auto_cancel=disabled)
  # 3-STUFIGES SIMD-/N-Node-ROUTING (Ledger §36.3): $GN_RUNNER_TAG kommt je Matrix-Zelle = die CAPABILITY-Klasse
  #   (nicht die Node-Marke). Pool-Modell ueber N amd64-Nodes: no_extension laeuft auf ALLEN amd64-Buildern (auch
  #   kleine Nodes ohne AVX, Odroid-H4-Klasse), avx2 nur wo AVX2-Hardware, avx512 nur wo AVX512-Hardware. Deshalb
  #   NUR der Capability-Tag (KEIN [prod,baremetal]-Praefix -> das wuerde die kleinen Nicht-prod-Nodes ausschliessen).
  #     no_extension -> "amd64"   (alle amd64: prod1/prod2 + pve1/pve2 + node3/node4 + Odroid-H4-Klasse + amd64-k8s)
  #     avx2         -> "avx2"    (prod1 Zen5 + prod2 RaptorLake + AVX2-faehige kleine Nodes, z.B. Odroid N97/AlderLake-N)
  #     avx512       -> "avx512"  (heute NUR prod1 Zen5; prod2 i9-14900KS/RaptorLake hat AVX512 hardware-fused-off)
  #   INFRA-HANDOUT (Doku Abschnitt 5): KEIN Runner traegt heute amd64/avx2/avx512 (Ist: prod1=[..amd], prod2=[..intel],
  #   kleine Nodes=[..x86_64..]) -> Nodes nach realer CPU-Faehigkeit taggen. Bis dahin pendet der Job (opt-in +
  #   W4-B-blockiert -> nichts laeuft verfrueht). Matrix ist tag-parametrisch fertig; nur die Runner-Tags fehlen.
  tags: ["$GN_RUNNER_TAG"]
  # LOCKING (Ledger §36.1): eine System-Achsen-Permutation darf nur auf genau EINEM Runner und EINER Concurrency
  #   gleichzeitig gebaut werden -> GitLab resource_group = natives Ein-Job-Lock je Zelle ueber ALLE Pipelines/Runner
  #   hinweg (Variablen werden expandiert). Der Schluessel enthaelt die Messsystem-Dimension ($GN_MSYS, §36.2: ein
  #   Planer baut multiple CEBs je Messsystem). Der mc-stat-Dedup bleibt die ZWEITE Schicht (historische Builds/
  #   Cache-Hits); resource_group verhindert den Live-Race zwischen gleichzeitigen Runnern (Ein-Runner-eine-Concurrency).
  resource_group: "gn-$GN_MSYS-$GN_SIMD-$GN_OPT-$GN_CHUNK"
  timeout: 30h                      # VOLL-Matrix-Zelle: ~20min Driver-Build + ~8h Chunk-Bau (32768 DLLs, W6-parallel) + Batch-Push
                                    # + Puffer fuer O3/avx512-Zellen. (2h-Pilot-Wert killte die 11509-Zellen — Session-Fund 19.07.)
  variables:
    GIT_SUBMODULE_STRATEGY: none    # REV-17-default:before_script klont die Submodule mit Deploy-Token
    COMDARE_GOLDEN_N_PROFILE: "$CI_PROJECT_DIR/Code/external/comdare-cache-engine/libs/cache_engine/algorithm_profiles/thesis_profiles/all_axes_golden.profile.xml"
    # -- Chunk-Fenster ueber den 2^17-Indexraum (Ledger §35.1). COMDARE_GN_CHUNK_COUNT MUSS == Laenge der GN_CHUNK-Liste. --
    COMDARE_GN_TOTAL: "131072"             # 2^17 Organ-Permutations-Indexraum (all_axes_golden)
    COMDARE_GN_CHUNK_COUNT: "4"            # Zahl der Chunk-Fenster je System-Permutation (== len(GN_CHUNK) in der Matrix)
    # -- Dedup-Key (Ledger §35.2/§35.3): GN_PREFIX = perm_build_version = <base>+cxx=<cxx>+opt=<opt>[+ext=<simd>]. --
    COMDARE_GN_BUILD_VERSION_BASE: "m3v2"  # experiment_run_entry.hpp:61 default; ueberschreibbar
    # W11 (Ledger §43.c): MUSS == a.compiler_tag des Treibers = cxx_compiler() = COMDARE_CXX bzw. GccCompilerAxis::
    #   driver_default()=="g++-16" (profile_run_facade.cpp). Nur dann stimmt der Pull-PREFIX (traegt +cxx=) mit dem
    #   Push-Objekt-Key ueberein -> der per-DLL-Pull (skip+pull / Teil-Resume) greift. Leer war die 'Pull compiler-
    #   agnostisch'-Luecke (PREFIX ohne +cxx= != Push-Key mit +cxx=). Bei abweichendem COMDARE_CXX hier nachziehen.
    COMDARE_GN_COMPILER_TAG: "g++-16"
    COMDARE_GN_PART_SIZE: "1024"           # W11 (§43.c): Teil-Marker nach je N gepushten DLLs (Cluster-Resume-Granularitaet)
    # -- Messsystem-Konfiguration (Ledger §36.2/§30: ein Planer baut multiple CEBs je Messsystem). Heute 1 Default-Zelle;
    #    weitere Messsysteme = weiterer GN_MSYS-Wert in den Matrizen (multipliziert die System-Permutations-Zellen). --
    GN_MSYS: "default"                     # Matrix-Default; je Zelle ueberschrieben (fliesst in resource_group + Treiber-Env)
  needs: ["verify:submodules"]
  script:
    - 'echo "== Toolchain =="; cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler")'
    - cd Code
    # Kein -DCOMDARE_ENABLE_PMC / kein Measurement-ON noetig: dies ist ein BAU-/VALIDIER-Beweis, kein Messlauf.
    - cmake -B build -G Ninja -DCOMDARE_V32_ENABLE=ON -DCMAKE_BUILD_TYPE=Release
    # Build-Parallelitaet via globalem CMAKE_BUILD_PARALLEL_LEVEL (Runner-Core-Budget), NICHT -j nproc (User 2026-06-25).
    - cmake --build build --target comdare-messung-driver
    - !reference [.storage_cache_activation, script]   # W4-A: mc-Alias 'prodcache' scharfschalten fuer Cross-Runner-Dedup (inert wenn COMDARE_STORAGE_CACHE!=true)
    - |
      set -euo pipefail
      # ── W4-A / Ledger §35: pro Matrix-Zelle System-Permutations-PREFIX + Chunk-Fenster ableiten (exportiert -> Folge-Steps, gleiche Shell) ──
      : "${GN_OPT:?GN_OPT (Matrix-Var) fehlt}"; : "${GN_SIMD:?GN_SIMD (Matrix-Var) fehlt}"; : "${GN_CHUNK:?GN_CHUNK (Matrix-Var) fehlt}"
      TOTAL="${COMDARE_GN_TOTAL:-131072}"; CCOUNT="${COMDARE_GN_CHUNK_COUNT:-4}"
      case "$GN_CHUNK" in ''|*[!0-9]*) echo "GN_CHUNK nicht numerisch: '$GN_CHUNK'"; exit 1;; esac
      [ "$GN_CHUNK" -lt "$CCOUNT" ] || { echo "GN_CHUNK=$GN_CHUNK >= COMDARE_GN_CHUNK_COUNT=$CCOUNT (GN_CHUNK-Liste/Count-Drift -> Matrix-Fehler)"; exit 1; }
      CHUNK_SIZE=$(( (TOTAL + CCOUNT - 1) / CCOUNT ))   # ceil(TOTAL/CCOUNT)
      START=$(( GN_CHUNK * CHUNK_SIZE ))
      if [ "$START" -ge "$TOTAL" ]; then
        echo "== Chunk $GN_CHUNK jenseits Indexraum ($TOTAL) -> No-Op-Zelle (CHUNK_COUNT ueberdimensioniert) =="; export GN_RANGE=""
      else
        REMAIN=$(( TOTAL - START )); COUNT_C=$CHUNK_SIZE; [ "$COUNT_C" -gt "$REMAIN" ] && COUNT_C=$REMAIN   # letzter Chunk klemmt
        export GN_RANGE="${START}:${COUNT_C}"
      fi
      # GN_PREFIX = perm_build_version (experiment_run_entry.hpp:263-265): <base>+cxx=<cxx>+opt=<opt>[+ext=<simd>], +ext bei no_extension WEG
      BASE="${COMDARE_GN_BUILD_VERSION_BASE:-m3v2}"; CXX="${COMDARE_GN_COMPILER_TAG:-}"
      SUF="+opt=${GN_OPT}"; [ "$GN_SIMD" != "no_extension" ] && SUF="${SUF}+ext=${GN_SIMD}"
      if [ -n "$CXX" ]; then export GN_PREFIX="${BASE}+cxx=${CXX}${SUF}"; else export GN_PREFIX="${BASE}${SUF}"; fi
      # Messsystem-Dimension (§36.2): heute default=neutral. Bei >1 Messsystem MUSS GN_MSYS in die Binary-Identitaet
      # (GN_PREFIX/build_version) einfliessen -- in Lockstep mit W4-B, damit der Dedup-Key je CEB eindeutig bleibt.
      export GN_MSYS="${GN_MSYS:-default}"; export COMDARE_GN_MSYS="$GN_MSYS"
      echo "== W4-A Zelle: msys=$GN_MSYS opt=$GN_OPT simd=$GN_SIMD chunk=$GN_CHUNK -> PREFIX='$GN_PREFIX' RANGE='${GN_RANGE:-<none>}' runner_tag='$GN_RUNNER_TAG' =="
      # ── Cross-Runner-Dedup (Ledger §35.2): Chunk-Marker im MinIO-Bucket -> HIT=skip+pull (Warm-Cache), MISS=build ──
      #    Grobe Job-Ebene: 1 Marker je (System-Permutation x Chunk). Die FEINE Per-DLL-Invalidierung (dll_is_current /
      #    algo_sig, #50) macht der Treiber ohnehin (§35.3) -> selbst ein grober False-Hit bleibt korrektheits-sicher.
      export GN_DECISION="build"
      if [ "${COMDARE_STORAGE_CACHE:-}" != "true" ]; then
        echo "[dedup] Storage inert (COMDARE_STORAGE_CACHE!=true) -> kein Cross-Runner-Sync, Bau lokal (golden-neutral)"
      elif ! command -v mc >/dev/null 2>&1; then
        echo "[dedup] mc-Binary fehlt im Runner-Image -> kein Sync, Bau lokal (Infra-Fehler-Klasse, kein Abbruch)"
      elif [ -z "${COMDARE_MINIO_BUCKET:-}" ] || [ "${COMDARE_MINIO_ENDPOINT:-}" != "prodcache" ]; then
        echo "[dedup] mc-Alias/Bucket nicht scharf (Ebene B inert) -> Bau lokal"
      elif [ -z "${GN_RANGE:-}" ]; then
        echo "[dedup] No-Op-Zelle (kein Range) -> nichts zu deduplizieren"
      else
        MARKER="prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/_gn_chunk_markers/${GN_RANGE//:/-}.done"
        # W11 (§43.c): Pull-Ziel = die Treiber-dll_dir <out>/e4_xml/dll (dorthin schaut dll_is_current: output_dir/<stem>/
        #   perm.dll). Frueher wurde nach gn_out/<PREFIX>/ gepullt -> der Treiber fand die DLLs NIE (Pfad-Mismatch,
        #   Resume-Luecke). Der Objekt-Key <PREFIX>/<stem>/perm.dll landet so unter <out>/e4_xml/dll/<stem>/perm.dll.
        PULL_DST="$CI_PROJECT_DIR/Code/gn_out/${GN_PREFIX}/e4_xml/dll"
        MARK_PREFIX="prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/_gn_chunk_markers/"
        if mc stat "$MARKER" >/dev/null 2>&1; then
          echo "[dedup] HIT: $GN_PREFIX Chunk $GN_RANGE bereits im Cluster gebaut -> SKIP (bereits im Cluster gebaut) + PULL (Warm-Cache)"
          if [ -n "$CXX" ]; then
            mkdir -p "$PULL_DST"
            mc cp --recursive "prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/" "$PULL_DST/" 2>&1 | tail -8 \
              || echo "[dedup] Pull-Teilfehler -> Bau-Naht faellt auf Neubau zurueck (Treiber-dll_is_current bleibt Invalidierer)"
          else
            echo "[dedup] COMDARE_GN_COMPILER_TAG leer -> DLL-Pull uebersprungen (PREFIX compiler-agnostisch, DLL-Key traegt +cxx=); Marker-Skip genuegt"
          fi
          export GN_DECISION="skip"
        elif [ -n "$CXX" ] && mc ls "$MARK_PREFIX" 2>/dev/null | grep -q "${GN_RANGE//:/-}\.part"; then
          # W11 (§43.c) TEIL-RESUME: kein Whole-Chunk-Marker, aber TEIL-Marker vorhanden (ein Vorlauf brach ab).
          #   Die bereits gepushten DLLs dieses PREFIX in die Treiber-dll_dir hydrieren -> dll_is_current ueberspringt
          #   sie, NUR die fehlenden werden neu gebaut (Cluster-Resume). GN_DECISION bleibt "build" (Stufe 2 baut weiter).
          echo "[dedup] TEIL-RESUME: Teil-Marker fuer $GN_PREFIX Chunk $GN_RANGE gefunden -> pulle bereits gepushte DLLs (nur Fehlende werden gebaut)"
          mkdir -p "$PULL_DST"
          mc cp --recursive "prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/" "$PULL_DST/" 2>&1 | tail -8 \
            || echo "[dedup] Teil-Pull-Teilfehler -> dll_is_current baut die fehlenden neu (kein Abbruch)"
        else
          echo "[dedup] MISS: $GN_PREFIX Chunk $GN_RANGE noch nicht im Cluster (kein Whole-/Teil-Marker) -> Bau (danach Marker + Push, s. Stufe 2)"
        fi
      fi
    - |
      set -euo pipefail
      DRIVER=$(find build -type f -name "comdare-messung-driver" | head -1)
      test -n "$DRIVER" -a -x "$DRIVER" || { echo "comdare-messung-driver fehlt: $DRIVER"; exit 1; }
      test -f "$COMDARE_GOLDEN_N_PROFILE" || { echo "NEW-GOLDEN-Voll-Konfig-Profil fehlt: $COMDARE_GOLDEN_N_PROFILE"; exit 1; }
      echo "== §33 Systembeweis Pre-Flight (--validate, rein lesend, KEIN Bau von DLLs, KEINE Messung) =="
      echo "   PROFIL=$COMDARE_GOLDEN_N_PROFILE"
      echo "   (alle 17 Achsen je 2 Auspraegungen = 2^17 = 131072 + <system_axes> opt O2/O3 x simd no_extension/avx2)"
      "$DRIVER" --validate "$COMDARE_GOLDEN_N_PROFILE" || { echo "NEW-GOLDEN-Voll-Konfig-Validierung fehlgeschlagen -> Systembeweis NICHT erbracht"; exit 1; }
      echo "== §33 Pre-Flight OK: das N-Voll-Konfig-Profil validiert gegen die EnabledStrategies (17x2 Organ) + System-Achsen (opt O0..O3/Ofast-REJECT, simd) =="
      echo "== FIXME INC-G6: die VOLLE 2^17-DLL-Materialisierung ist GO-pflichtig/gestaffelt (GN-2-Guard) und NICHT Teil dieses Jobs; =="
      echo "   der Systembeweis-Anker bleibt der Compile-Time-Guard static_assert(...==131072) + CRC64 0xF1C1F26A1232073B in der ce-Test-Suite."
      echo "=== build:golden-n Stufe 1 OK (§33 Pre-Flight-Beweis erbracht; kein Messlauf, kein Drop, golden-neutral) ==="
    # -- Stufe 2 (INC-G6, W4-A Chunk-Bau je Matrix-Zelle): baut NUR die System-Permutation dieser Zelle (opt=$GN_OPT
    #    x simd=$GN_SIMD) fuer das Chunk-Fenster $GN_RANGE. Der Cross-Runner-Dedup-Step (oben) hat GN_DECISION gesetzt:
    #    skip (HIT: schon im Cluster + gepullt) ODER build (MISS). Solange die ce-Materialisierungs-Naht (lazy
    #    Per-Index-Adhoc-Emitter, W4-B) NOCH NICHT gelandet ist, meldet der build-Zweig die fehlende Voraussetzung HART
    #    (exit 3) und baut NICHTS -- KEIN Fake-DLL, kein Erfolgs-Haken ohne reale Materialisierung (Anti-Phantom,
    #    no_success_marks_without_literal_output). Die EINZIGE Zeile, die beim Landen von W4-B ersetzt wird, ist unten
    #    als "UMSCHALT-ZEILE" markiert. Bauplan: docs/plaene/20260719-inc-g6-materialisierung-BAUPLAN.md (Abschnitt 1+6+7)
    #    + Matrix/Dedup: docs/plaene/20260719-cluster-parallel-build-MATRIX.md.
    - |
      set -euo pipefail
      if [ "${GN_DECISION:-build}" = "skip" ]; then
        echo "== Stufe 2 SKIP (Cross-Runner-Dedup HIT): $GN_PREFIX Chunk $GN_RANGE bereits im Cluster -> Warm-Cache gepullt, kein Neubau =="
        exit 0
      fi
      if [ -z "${GN_RANGE:-}" ]; then
        echo "== Stufe 2 No-Op (Chunk jenseits Indexraum) -> nichts zu bauen, golden-neutral =="
        exit 0
      fi
      echo "== Stufe 2 (W4-A Chunk-Bau) MISS: baue Permutation opt=$GN_OPT simd=$GN_SIMD Fenster $GN_RANGE unter PREFIX '$GN_PREFIX' =="
      echo "   INTENDIERT (nach W4-B ce-Naht): provision-only (Bau ohne Messung) je Chunk, dann GN-9-Groessen-Report:"
      echo "     dlls=\$(find <dll_dir> -name perm.dll | wc -l); bytes=\$(find <dll_dir> -name perm.dll -printf '%s\\n' | awk '{s+=\$1} END{print s+0}')"
      echo "     extrapolation_131072 = bytes/dlls*131072  (GN-9-Bloat-Deckel je Chunk, LITERAL geloggt)"
      # ====================================================================================================
      # UMSCHALT-ZEILE (W4-B): der folgende Melde-/exit-3-Block wird durch DIESEN EINEN realen Treiber-Aufruf
      #   + Marker-Push ersetzt (nur diese Naht aendert sich; Matrix/Dedup/Routing bleiben):
      #     COMDARE_THESIS_PROFILE="$COMDARE_GOLDEN_N_PROFILE" COMDARE_GOLDEN_N_RANGE="$GN_RANGE" \
      #       COMDARE_GN_OPT="$GN_OPT" COMDARE_GN_SIMD="$GN_SIMD" COMDARE_GOLDEN_N_PROVISION_ONLY=true \
      #       "$DRIVER" experiment_config "$CI_PROJECT_DIR/Code/gn_out/$GN_PREFIX"
      #     # danach GN-9-Report, dann (nur bei COMDARE_STORAGE_CACHE=true) der Chunk-Marker fuer den naechsten Runner:
      #     [ "${COMDARE_STORAGE_CACHE:-}" = "true" ] && command -v mc >/dev/null 2>&1 && \
      #       printf 'algo_sig=%s compiler=%s range=%s utc=%s\n' "<algo_sig>" "${COMDARE_GN_COMPILER_TAG:-na}" "$GN_RANGE" "$(date -u +%FT%TZ)" \
      #       | mc pipe "prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/_gn_chunk_markers/${GN_RANGE//:/-}.done"
      #   (die Per-DLL-perm.dll/-sidecar pusht die ce-artifact_cache-Naht via COMDARE_STORAGE_CACHE bereits selbst;
      #    dll_is_current/algo_sig bleibt der Organ-Invalidierer, #50 -> §35.3.)
      # ====================================================================================================
      # UMGESCHALTET (W4-B gelandet): echter Chunk-Bau via lazy Per-Index-Emitter + Chunk-Fenster + provision-only.
      DLL_DIR="$CI_PROJECT_DIR/Code/gn_out/$GN_PREFIX/e4_xml/dll"   # Treiber schreibt DLLs unter <out>/e4_xml/dll
      COMDARE_THESIS_PROFILE="$COMDARE_GOLDEN_N_PROFILE" COMDARE_GOLDEN_N_RANGE="$GN_RANGE" \
        COMDARE_GN_OPT="$GN_OPT" COMDARE_GN_SIMD="$GN_SIMD" COMDARE_GOLDEN_N_PROVISION_ONLY=true COMDARE_RUN_SOTA=0 \
        "$DRIVER" experiment_config "$CI_PROJECT_DIR/Code/gn_out/$GN_PREFIX"
      count=$(find "$DLL_DIR" -name 'perm.dll' 2>/dev/null | wc -l)
      bytes=$(find "$DLL_DIR" -name 'perm.dll' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{print s+0}')
      echo "GN-9 chunk[$GN_RANGE]: dlls=$count bytes=$bytes extrapolation_131072=$(( count>0 ? bytes/count*131072 : 0 )) B"
      [ "${COMDARE_STORAGE_CACHE:-}" = "true" ] && command -v mc >/dev/null 2>&1 && \
        printf 'compiler=%s range=%s utc=%s\n' "${COMDARE_GN_COMPILER_TAG:-na}" "$GN_RANGE" "$(date -u +%FT%TZ)" \
        | mc pipe "prodcache/${COMDARE_MINIO_BUCKET}/${GN_PREFIX}/_gn_chunk_markers/${GN_RANGE//:/-}.done" || true

# ── build:golden-n (W4-A, Ledger §35/§36): die kanonische §33-System-Achsen-Matrix (opt O2/O3 x simd no_extension/avx2),
#    N-Node-Pool-geroutet (§36.3): no_extension -> Tag "amd64" (ALLE amd64-Nodes inkl. kleiner Nodes ohne AVX),
#    avx2 -> Tag "avx2". Messsystem-Dimension GN_MSYS (§36.2) heute 1 Default -> 2 SIMD x 1 msys x 2 opt x 4 chunk = 16 Zellen/Jobs.
#
#    DEPRECATED (W10-B, Ledger §42): diese statische, HANDGESCHRIEBENE 24-Zellen-Matrix war der erfolgreiche W4-PILOT
#    (die Steuerung lag in der YAML statt im Planer). Die ZIEL-Steuerung ist die dynamische, CE-gesteuerte W10-Kette
#    (planer:delegate -> die CE emittiert STUFE 1 [Mess-Achsen/CEB] und die CEB emittiert STUFE 2 [System-Achsen/
#    Tier]). Diese Matrix bleibt als GATED FALLBACK erhalten (Pilot-Historie + 11509-Artefakt-Lieferant) -- NICHT
#    geloescht. Sie laeuft NUR NOCH, wenn ZUSAETZLICH COMDARE_STATIC_MATRIX_FALLBACK=="true" gesetzt ist (Default
#    AUS): so ist planer:delegate der NEUE Standard-Pfad hinter COMDARE_BUILD_GOLDEN_N. avx512 = separater Job unten.
build:golden-n:
  extends: .golden_n_build
  parallel:
    matrix:
      - GN_SIMD: ["no_extension"]
        GN_RUNNER_TAG: ["amd64"]       # §36.3: ALLE amd64-Nodes (prod1/prod2 + pve1/pve2/node3/node4 + Odroid-Klasse); INFRA: Tag 'amd64' setzen
        GN_MSYS: ["default"]
        GN_OPT: ["O2", "O3"]
        GN_CHUNK: ["0", "1", "2", "3"]
      - GN_SIMD: ["avx2"]
        GN_RUNNER_TAG: ["avx2"]        # §36.3: AVX2-faehige Nodes (prod1 Zen5 + prod2 RaptorLake + AVX2-kleine Nodes); INFRA: Tag 'avx2' setzen
        GN_MSYS: ["default"]
        GN_OPT: ["O2", "O3"]
        GN_CHUNK: ["0", "1", "2", "3"]
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'          # (Netz) Bot-Writeback triggert NIE einen Bau-Beweis
      when: never
    # DEPRECATED-Fallback: DOPPELT gegatet -> Default AUS. Der Standard ist planer:delegate (COMDARE_BUILD_GOLDEN_N).
    - if: '$COMDARE_BUILD_GOLDEN_N == "true" && $COMDARE_STATIC_MATRIX_FALLBACK == "true"'

# ── build:golden-n-avx512 (W4-A, EXTRA opt-in): die avx512-Erweiterung, N-Node-geroutet auf Tag "avx512" (§36.3;
#    heute NUR prod1/Zen5 avx512-faehig, prod2/RaptorLake fused-off). GN_MSYS default -> 1 SIMD x 1 msys x 2 opt x 4 chunk = 8 Zellen/Jobs.
#    DEPRECATED (W10-B, §42): Teil der statischen Pilot-Matrix (s. build:golden-n) -> DREIFACH gegatet, Default AUS.
#    Laeuft NUR, wenn COMDARE_BUILD_GOLDEN_N=="true" UND COMDARE_STATIC_MATRIX_FALLBACK=="true" UND
#    COMDARE_GN_INCLUDE_AVX512=="true". avx512 gehoert NICHT zum §33-golden-Kernsatz -> bewusst separater Job.
build:golden-n-avx512:
  extends: .golden_n_build
  parallel:
    matrix:
      - GN_SIMD: ["avx512"]
        GN_RUNNER_TAG: ["avx512f"]     # §36.3 + A3 (Weg a): Tag = REALES march-Flag -mavx512f (=> "avx512f", NICHT "avx512"); NUR avx512-faehige Nodes (heute prod1/Zen5); INFRA: Tag 'avx512f' setzen
        GN_MSYS: ["default"]
        GN_OPT: ["O2", "O3"]
        GN_CHUNK: ["0", "1", "2", "3"]
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'
      when: never
    # DEPRECATED-Fallback (s. build:golden-n): nur mit explizitem COMDARE_STATIC_MATRIX_FALLBACK + avx512-Opt-in.
    - if: '$COMDARE_BUILD_GOLDEN_N == "true" && $COMDARE_STATIC_MATRIX_FALLBACK == "true" && $COMDARE_GN_INCLUDE_AVX512 == "true"'

# ── Stage persist (#22, User 2026-07-11, Ledger §0-DoD-6/§11-G): die Auswertungs-Dokumente EINES Laufs additiv
#    nach measurement/<YYYYMMDD-HHMMSS-p{pipeline}>/ im super-Root sammeln + per commit+MERGE+push nach
#    development ZURUECKSCHREIBEN — sonst gehen die Mess-Ergebnisse am Pipeline-Ende verloren.
#    INERT-by-default: der Job wird GAR NICHT erzeugt, solange nicht COMDARE_PERSIST_MEASUREMENTS=="true" auf der
#    development-Branch gesetzt ist; laeuft er, pusht er NUR wenn zusaetzlich das Write-Credential
#    (COMDARE_WRITEBACK_USER/COMDARE_WRITEBACK_TOKEN, Infra separat = Project-Access-Token write_repository,
#    masked+protected) gesetzt ist. Kein Submodul-Klon (PDF/Manifest/Prebackup via needs-artifacts) → before_script:[]
#    + GIT_SUBMODULE_STRATEGY:none ueberspringt den REV-17-default:before_script. Loop-Schutz DREIFACH: push -o
#    ci.skip (primaer) + [skip ci] in der Commit-Message (backup) + rules _bot_->never (Netz). Rueckschreiben per
#    MERGE (User-Direktive 11.07.: „durch merge, kein rebase"); measurement/<RUN_TS>/ ist disjunkt → konfliktfrei.
persist:measurements:
  stage: persist
  tags: [baremetal]
  before_script: []                 # ueberschreibt default:before_script -> KEIN Cross-Projekt-Submodul-Klon
  cache:
    paths: []                       # dieser Job kompiliert nicht -> kein ccache-Zip-Sync
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "0"                  # VOLLER Klon load-bearing: shallow bricht Merge/Push (fehlende merge-base)
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: thesis:pdf               # PDF — OPTIONAL: thesis:pdf ist COMDARE_TEXLIVE_AVAILABLE-gegatet
      artifacts: true
      optional: true
    - job: manifest:provenance      # build_manifest.txt (Provenance)
      artifacts: true
    # HINWEIS (Anti-Phantom, Ledger §G2): prebackup:measurements ist BEWUSST KEIN need mehr — sein
    # Artefakt ist ein reiner Mechanismus-Selbsttest (synthetische CSVs), der NICHT in den measurement-
    # Baum gehoert. Siehe Block (3) unten. Reale versionierte Backups sind #202-gegatet.
    - job: measure:golden-320       # measure_out/ (golden-320-Mess-CSVs) — OPTIONAL: nur wenn COMDARE_RUN_MEASURE gesetzt war
      artifacts: true
      optional: true
    - job: measure:smoke            # measure_out_smoke/ (#26/GO-5 Smoke-CSVs) — OPTIONAL: nur bei Smoke-/Voll-Messlauf vorhanden
      artifacts: true
      optional: true
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'                                           # (Netz) Bot-Writeback triggert NIE persist
      when: never
    - if: '$COMDARE_PERSIST_MEASUREMENTS == "true" && $CI_COMMIT_BRANCH == "development"'  # INERT: nur bei Opt-in auf development
  script:
    - |
      set -euo pipefail
      # ── (0) INERT-Guards (defense-in-depth; die rules gaten bereits) ──
      if [ "${COMDARE_PERSIST_MEASUREMENTS:-}" != "true" ]; then
        echo "INERT: COMDARE_PERSIST_MEASUREMENTS != true -> kein Sammeln/Push"; exit 0
      fi
      if [ -z "${COMDARE_WRITEBACK_USER:-}" ] || [ -z "${COMDARE_WRITEBACK_TOKEN:-}" ]; then
        echo "FEHLER: COMDARE_PERSIST_MEASUREMENTS=true, aber COMDARE_WRITEBACK_USER/COMDARE_WRITEBACK_TOKEN fehlt -> Infra: maskiertes+protected write_repository-Token setzen"; exit 1
      fi
      # ── (1) FS-sicherer, kollisionsfreier, sortierbarer UTC-Laufordner (KEIN ':' -> Windows/NTFS-sicher) ──
      RUN_TS="$(date -u +%Y%m%d-%H%M%S)-p${CI_PIPELINE_ID:-0}"
      BK=measurement; DEST="$BK/$RUN_TS"; mkdir -p "$DEST"
      echo "== persist -> $DEST =="
      # ── (2) prebackup(): additiv, sha256-verifiziert, NIE ueberschreiben (Muster aus prebackup:measurements) ──
      sha() { sha256sum < "$1" | cut -d' ' -f1; }
      prebackup() {
        local src="$1" ver="$2" dir base dst
        dir="$BK/$ver"; mkdir -p "$dir"; base=$(basename "$src"); dst="$dir/$base"
        if [ -e "$dst" ]; then
          if [ "$(sha "$src")" = "$(sha "$dst")" ]; then echo "  idempotent: $base@$ver (gleicher sha256)"; return 0; fi
          echo "  SCHUTZ: $base@$ver ABWEICHENDER sha256 -> Overwrite VERBOTEN"; return 3
        fi
        cp -- "$src" "$dst"
        [ "$(sha "$src")" = "$(sha "$dst")" ] || { echo "  FEHLER: sha-Mismatch $base@$ver"; return 1; }
        echo "  gesichert: $base@$ver (sha256=$(sha "$dst"))"
      }
      # ── (3) Auswertungs-Dokumente einsammeln (fehlende tolerieren) ──
      persisted=0
      for pdf in thesis/diplomarbeit/*.pdf; do [ -e "$pdf" ] || continue; prebackup "$pdf" "$RUN_TS"; persisted=$((persisted+1)); done
      if [ -f manifest_out/build_manifest.txt ]; then prebackup manifest_out/build_manifest.txt "$RUN_TS"; persisted=$((persisted+1)); fi
      # Anti-Phantom (Review 2026-07-12, Ledger §G2 / §0-DoD-6 Mess-Integritaet): der prebackup:measurements-
      # Job ist ein reiner MECHANISMUS-SELBSTTEST (synthetische "messung v1/v2"-CSVs in prebackup_selftest_store/).
      # Er wird via seinem EIGENEN 12-Wochen-Artefakt belegt und bewusst NICHT in den autoritativen
      # measurement/<RUN_TS>/-Baum kopiert — sonst akkumuliert Fake-Material unter der Nie-loeschen-Doktrin.
      # REAL versionierte Mess-CSV-Sicherungen (NAS/MinIO) sind #202-gegatet; sobald ein echter Backup-
      # Produzent existiert, bekommt er hier einen EIGENEN Sammler, der ausschliesslich echte Daten aufnimmt.
      # measure_out/ = die golden-320-Mess-CSVs des measure:golden-320-Jobs (nur bei COMDARE_RUN_MEASURE-Lauf vorhanden).
      # NUR *.csv strukturerhaltend kopieren — NIE die ~320 DLL-Binaries (Repo-Bloat). Die .gitignore-Negation
      # !measurement/**/*.csv macht die kopierten CSVs trackbar (sonst droppt `git add` sie via *.csv-Regel).
      if [ -d Code/measure_out ]; then
        n_csv=0
        while IFS= read -r f; do
          rel="${f#Code/measure_out/}"; mkdir -p "$DEST/measure_out/$(dirname "$rel")"
          cp -- "$f" "$DEST/measure_out/$rel"; n_csv=$((n_csv+1))
        done < <(find Code/measure_out -type f \( -name '*.csv' -o -name '*.tex' \))
        if [ "$n_csv" -gt 0 ]; then echo "  gesichert: measure_out/ ($n_csv Mess-CSVs + regenerierte Anhang-.tex, keine DLL-Binaries)"; persisted=$((persisted+1)); fi
      fi
      # measure_out_smoke/ = die Smoke-/Coverage-Mess-CSVs des measure:smoke-Jobs (#26/GO-5) — gleiche
      # additive Mechanik, eigener Zielordner (kollisionsfrei zum golden-Lauf derselben Pipeline).
      if [ -d Code/measure_out_smoke ]; then
        n_csv=0
        while IFS= read -r f; do
          rel="${f#Code/measure_out_smoke/}"; mkdir -p "$DEST/measure_out_smoke/$(dirname "$rel")"
          cp -- "$f" "$DEST/measure_out_smoke/$rel"; n_csv=$((n_csv+1))
        done < <(find Code/measure_out_smoke -type f \( -name '*.csv' -o -name '*.tex' \))
        if [ "$n_csv" -gt 0 ]; then echo "  gesichert: measure_out_smoke/ ($n_csv Smoke-Mess-CSVs + regenerierte Anhang-.tex, keine DLL-Binaries)"; persisted=$((persisted+1)); fi
      fi
      {
        echo "# persist:measurements Laufordner — Provenance (#22, Ledger §11-G)"
        echo "run_ts=$RUN_TS"
        echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "ci_pipeline_id=${CI_PIPELINE_ID:-NA}"; echo "ci_pipeline_url=${CI_PIPELINE_URL:-NA}"
        echo "super_commit_sha=${CI_COMMIT_SHA:-$(git rev-parse HEAD 2>/dev/null || echo NA)}"
        echo "super_commit_ref=${CI_COMMIT_REF_NAME:-NA}"; echo "persisted_artifact_count=$persisted"
      } > "$DEST/PROVENANCE.txt"
      echo "-- Laufordner --"; find "$DEST" -type f | sort
      [ "$persisted" -eq 0 ] && echo "WARNUNG: keine Auswertungs-Dokumente gefunden (nur PROVENANCE.txt)"
      # ── (4) Writeback: commit -> bei non-ff MERGE origin-Tip (User-Direktive: MERGE, KEIN rebase) -> push ──
      git config user.name "measurement-bot"; git config user.email "measurement-bot@ci.local"
      # Write-Credential NUR als Var-Referenz (maskiert+protected; KEIN set -x / kein `git remote -v`-Echo -> kein Leak).
      git remote set-url origin "https://${COMDARE_WRITEBACK_USER}:${COMDARE_WRITEBACK_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch origin "$CI_COMMIT_BRANCH"
      git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"   # detached HEAD -> benannter Branch am origin-Tip (measurement/ bleibt untracked erhalten)
      git add -- measurement/
      if git diff --cached --quiet; then echo "nichts einzuchecken (leerer Commit vermieden)"; exit 0; fi
      git commit -m "measurement(#22): Lauf ${CI_PIPELINE_ID:-NA} ${RUN_TS} [skip ci]"
      for attempt in 1 2 3 4 5; do
        if git push -o ci.skip origin "HEAD:$CI_COMMIT_BRANCH"; then
          echo "=== persist:measurements OK: gepusht (Versuch $attempt) nach $CI_COMMIT_BRANCH ==="; exit 0
        fi
        echo "push abgelehnt (non-ff-Race) -> fetch + MERGE origin-Tip (kein rebase) + retry ($attempt)" >&2
        git fetch origin "$CI_COMMIT_BRANCH"
        # measurement/<RUN_TS>/ ist disjunkt -> Merge mechanisch konfliktfrei; [skip ci] auch im Merge-Commit.
        if ! git merge --no-edit -m "Merge origin/$CI_COMMIT_BRANCH in measurement-writeback ${RUN_TS} [skip ci]" "origin/$CI_COMMIT_BRANCH"; then
          git merge --abort || true
          echo "UNerwarteter Merge-Konflikt (Versuch $attempt) -> echter Bug, Abbruch (kein --force)" >&2; exit 1
        fi
        sleep $(( (RANDOM % 5) + 2 ))
      done
      echo "FEHLER: writeback nach 5 Versuchen fehlgeschlagen (development bewegt sich zu schnell?)" >&2; exit 1

# ── planer:delegate (W10-B, Ledger §42): die DELEGATION der Anwender-XML an die CE — der NEUE Standard-Pfad
#    (loest die statische Matrix als STEUERUNG ab, §42: „Eigentlich erhaelt die Cache Engine die XML und
#    uebernimmt die gesamte Arbeit"). Der super-CI-Job baut NUR den Treiber, reicht das golden-Profil an die CE
#    (--dump-ci) und legt die CE-emittierte STUFE-1-YAML als Artefakt ab. ALLE Steuerung/Emission liegt in der CE:
#    STUFE 1 (diese YAML) = je Mess-Kombination [a,b,c] die CEB-Jobs (ceb:build/emit/trigger); die ceb:emit-Jobs
#    rufen --emit-tier-ci -> die CEB emittiert STUFE 2 (System-Perms + Tier-Chunk-Jobs + gegatete Mess-Jobs) als
#    Grandchild (parent->child->grandchild = GitLab-Nesting-Tiefe 2).
#    GATE: der NEUE Standard laeuft hinter COMDARE_BUILD_GOLDEN_N (die statische Matrix ist auf COMDARE_STATIC_
#    MATRIX_FALLBACK verschoben, Default AUS). Zusaetzlich bleibt COMDARE_DYNAMIC_PLANER_CI als ISOLIERTES Opt-in
#    (nur die Delegation ohne den Rest). INERT-by-default: ohne beide Flags wird der Job NIE erzeugt (--dump-ci ist
#    rein lesend: KEIN Bau, KEINE Messung). HINWEIS (Architekt): das emittierte Child-YAML wird vor dem
#    Scharfschalten per GitLab-CI-Lint geprueft (nicht via API in diesem Job).
planer:delegate:
  stage: planer
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none    # REV-17-default:before_script klont die Submodule mit Deploy-Token (wie .golden_n_build)
    COMDARE_GOLDEN_N_PROFILE: "$CI_PROJECT_DIR/Code/external/comdare-cache-engine/libs/cache_engine/algorithm_profiles/thesis_profiles/all_axes_golden.profile.xml"
  needs: ["verify:submodules"]
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'          # (Netz) Bot-Writeback triggert NIE die dynamische Planer-CI
      when: never
    - if: '$COMDARE_BUILD_GOLDEN_N == "true"'      # NEUER STANDARD-Pfad (loest die statische Matrix ab)
    - if: '$COMDARE_DYNAMIC_PLANER_CI == "true"'   # ISOLIERTES Opt-in (nur die Delegation, ohne den Rest)
  script:
    - 'echo "== Toolchain =="; cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler")'
    - cd Code
    - cmake -B build -G Ninja -DCOMDARE_V32_ENABLE=ON -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --target comdare-messung-driver
    - |
      set -euo pipefail
      DRIVER=$(find build -type f -name "comdare-messung-driver" | head -1)
      test -n "$DRIVER" -a -x "$DRIVER" || { echo "comdare-messung-driver fehlt: $DRIVER"; exit 1; }
      test -f "$COMDARE_GOLDEN_N_PROFILE" || { echo "golden-Profil fehlt: $COMDARE_GOLDEN_N_PROFILE"; exit 1; }
      echo "== W10-B: super delegiert die Anwender-XML an die CE (--dump-ci = STUFE 1, rein lesend, KEIN Bau/Messung) =="
      "$DRIVER" --dump-ci "$COMDARE_GOLDEN_N_PROFILE" > "$CI_PROJECT_DIR/planer-child-ci.yml"
      echo "== CE-emittierte STUFE-1-Pipeline (erste 40 Zeilen) =="; head -40 "$CI_PROJECT_DIR/planer-child-ci.yml"
      echo "== STUFE-1 CEB-Bau-Jobs (je Mess-Kombination): $(grep -c '# JOB ceb-build combo ' "$CI_PROJECT_DIR/planer-child-ci.yml") =="
      echo "== STUFE-1 CEB-Trigger-Jobs (Grandchild -> STUFE 2): $(grep -c '# JOB ceb-trigger combo ' "$CI_PROJECT_DIR/planer-child-ci.yml") =="
  artifacts:
    paths:
      - planer-child-ci.yml
    expire_in: 1 week

# ── planer:delegate-trigger (W10-B): triggert die CE-emittierte STUFE-1-Child-Pipeline (Dynamic-Child-Pipeline,
#    trigger: include: artifact:). Die Child-Pipeline emittiert ihrerseits je Mess-Kombination ueber die CEB die
#    STUFE-2-YAML als GRANDCHILD (parent->child->grandchild = GitLab-Nesting-Tiefe 2). strategy:depend = der
#    Parent-Job spiegelt den Child-Status (synchron + gated). Dieselben Gates wie planer:delegate.
planer:delegate-trigger:
  stage: planer
  needs:
    - job: planer:delegate
      artifacts: true
  # S1/A1 P-TOTAL (Ledger 46): explizite Forward-Allowlist an der ERSTEN Trigger-Grenze. Selbst-enthaltene
  # Child-Pipelines erben Pipeline-Variablen NICHT -> COMDARE_GN_TOTAL wird als YAML-Variable dieses Bridge-Jobs
  # deklariert (RHS = der super-Pipeline-Wert) und via forward:yaml_variables an die STUFE-1-Child gereicht. KEIN
  # pipeline_variables:true (Isolation: die Child erbt NICHT den gesamten Eltern-Variablenraum, Byte-Determinismus).
  variables:
    COMDARE_GN_TOTAL: "$COMDARE_GN_TOTAL"
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'
      when: never
    - if: '$COMDARE_BUILD_GOLDEN_N == "true"'
    - if: '$COMDARE_DYNAMIC_PLANER_CI == "true"'
  trigger:
    include:
      - artifact: planer-child-ci.yml
        job: planer:delegate
    strategy: depend
    forward:
      yaml_variables: true       # die explizite Allowlist oben (COMDARE_GN_TOTAL) durchreichen
      pipeline_variables: false  # KEIN blindes Erben des gesamten Eltern-Variablenraums (Modul-Trigger-Isolation)

# ── ergebnis:holen (W10-B, Ledger §42, SKELETT): das ERGEBNIS-HOLEN gehoert laut §42 in die Diplomarbeit-CI
#    („das Holen der Messergebnisse gehoert auf der Grundlage der cache-engine-lib in die Diplomarbeit-CI auf
#    Delegation der cache-engine-Framework-lib"). Es sammelt die von den CEB-emittierten STUFE-3-Mess-Jobs
#    zurueckgeschriebenen CSVs (measure_out/) und reicht sie an persist:measurements (der bestehende Writeback-
#    Mechanismus, #22/§11-G) weiter. SKELETT auf der persist:measurements-Grundlage: heute dokumentiert es den
#    Fluss + prueft die Artefakt-Naht; der scharfe Sammel-/Delegations-Aufruf ist GN-11/320er-gated (kein
#    Auto-Messlauf). INERT-by-default (DREIFACH: COMDARE_BUILD_GOLDEN_N-Gate + when:manual + _bot_-never).
ergebnis:holen:
  stage: planer
  tags: [baremetal]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  needs:
    - job: planer:delegate-trigger
      optional: true
  rules:
    - if: '$GITLAB_USER_LOGIN =~ /_bot_/'
      when: never
    - if: '$COMDARE_BUILD_GOLDEN_N == "true"'
      when: manual                                 # GN-11/320er-Gate: das scharfe Ergebnis-Holen ist opt-in
      allow_failure: true
  script:
    - |
      set -euo pipefail
      echo "== W10-B: ergebnis:holen (SKELETT auf persist:measurements-Grundlage, §42) =="
      echo "-- Delegation an die cache-engine-lib: die CEB-emittierten STUFE-3-Mess-Jobs schreiben je Zelle"
      echo "   ein CSV zurueck (measure:[a,b,c][d,e,f][g,h,i], 1-Thread §38.b). ergebnis:holen sammelt sie und"
      echo "   reicht sie an persist:measurements (#22/§11-G Writeback nach development) weiter."
      echo "-- GATED (GN-11/320er): der scharfe Sammel-Aufruf ist erst nach dem User-Mess-Entscheid aktiv."
      # SKELETT-Naht (GN-11/320er-gated, NICHT aktiv): sammelt die measure_out/-CSVs der Grandchild-Mess-Jobs
      #   mkdir -p "$CI_PROJECT_DIR/measurement/ergebnis"
      #   find "$CI_PROJECT_DIR" -path '*/measure_out/*.csv' -exec cp {} "$CI_PROJECT_DIR/measurement/ergebnis/" \;
      #   -> Uebergabe an persist:measurements (needs: measure:*-Artefakte, bestehender Writeback-Mechanismus).
      if [ -d "$CI_PROJECT_DIR/measure_out" ]; then
        echo "measure_out/ gefunden: $(find "$CI_PROJECT_DIR/measure_out" -name '*.csv' 2>/dev/null | wc -l) CSV(s)"
      else
        echo "measure_out/ (noch) nicht vorhanden -> Skelett-Lauf, kein Sammeln (golden-neutral)."
      fi
