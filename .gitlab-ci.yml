# ── D2-G4 NACHSATZ (2026-08-09): ALLOWLIST-ZUSICHERUNG DER ABNAHME ##06 ──
# DER BEFUND, der diesen Job erzwingt. Die Allowlist der Abnahme ##06 deckte
# BEDINGUNGEN statt STELLEN. Ein gewuerfelter Koeder
# 'add_test(NAME test_schleich_<zufall>)' hinter dem bereits allowgelisteten
# if(COMDARE_PRT_ART_LEGACY_AVAILABLE) lief mit EXIT 0 durch: der Zaehler
# allowlist_mit_begruendung stieg still 6 -> 7, obwohl der Eintrag woertlich
# "Deckt 4 Registrierungen" zusichert. Wer eine neue Registrierung unter eine
# bestehende Ausnahme haengt, hat sie nicht begruendet, sondern versteckt --
# exakt die Fehlerklasse "stille Ausnahme", gegen die ##06 gebaut ist.
#
# WARUM DIESER JOB HEUTE SCHON FAHRBAR IST, DIE VOLLE FORMEL ABER NICHT.
# ##06 hat in der super-CI keinen IST-Nenner: 'ctest -N' kommt in dieser Datei
# nicht vor, und der einzige Job mit Live-Inventur (test:coverage-guard auf der
# ce-Seite) veroeffentlicht seine Ausgabe nicht als Artefakt. Ohne IST-Nenner
# waere die volle Formel entweder dauerrot oder muesste alles allowlisten --
# beides wertlos, deshalb bleibt sie bis Posten D2 baremetal (Fussnote D2-G4).
# Die ZUSICHERUNG dagegen braucht keinen Bau: die Stellenzahl je Bedingung kommt
# allein aus dem CMake-Quelltext. Genau der Teil, ueber den der Koeder
# hereinkam, ist damit ab heute in der CI und nicht erst nach D2.
#
# WARUM --gegen-vorlage MITFAEHRT: sonst bleibt die Plan-Zahl eine Behauptung,
# die nur beim Schreiben einmal stimmte. Der Marker im Wellenplan v2 wird gegen
# die Messung gehalten; driftet er, wird der Job rot. Der umgekehrte Weg ist
# ausdruecklich zu: ein Marker-Bump legalisiert eine Schleich-Registrierung
# NICHT, weil die Zusicherung in der Allowlist steht und nicht im Marker
# (Selbsttest-Fall K6 haelt genau das fest).
#
# WARUM DER SELBSTTEST ZUERST LAEUFT (T-7): eine Wache ohne Probe ist eine
# Behauptung. Er baut eine Fixture mit von Hand abgezaehltem Inventar (zweite
# Quelle, T-3) und wirft je Lauf NEU GEWUERFELTE Koeder hinein: unter
# allowgelisteter Bedingung, unter neuer Bedingung, entfallende Stelle, altes
# Zweifeld-Format, tote Ausnahme, Marker-Bump. Der Gegenkoeder am
# unmanipulierten Baum haelt fest, dass die Wache nicht einfach immer rot ist.
#
# WARUM KEIN allow_failure: eine advisory Wache ist die naechste stille Null
# (gleiche Begruendung wie test:host-klassen-bericht). KEIN .code-rules: eine
# Schleich-Registrierung kommt ueber einen reinen Gitlink-Bump des ce ins Repo,
# ohne dass sich im super eine einzige Code-Datei aendert.
test:abnahme06-zusicherung:
  stage: test
  tags: [baremetal]
  needs: []
  cache:
