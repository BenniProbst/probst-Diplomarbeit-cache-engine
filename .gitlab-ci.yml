# standen, und Prosa wird nicht rot. Der Plan traegt jetzt einen maschinenlesbaren Anker-Block
# (PZW-*); die Wache leitet dieselben Zahlen bei jedem Lauf neu aus dem Code ab. SOLL kommt aus
# dem Dokument, IST aus dem Code -- zwei Quellen (T-3), keine wird aus der anderen abgeleitet.
