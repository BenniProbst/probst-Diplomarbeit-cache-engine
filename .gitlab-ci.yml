# probst-Diplomarbeit-cache-engine (Super) — GitLab CI/CD (REV 9, 2026-06-25): ci-templates-Lint + Mess→PDF-Flow
# ─────────────────────────────────────────────────────────────────────────────
# Bindet die ci-templates-Lint-Stage ein (über Code/, ohne die Submodul-Quellen unter Code/external/)
# und bewahrt den Diplomarbeit-Mess→PDF-Flow (Submodule ziehen → Auswertungswerkzeuge bauen +
# cache-engine-Mess-Artefakte konsumieren → Diplomarbeit-PDF mit REALEN Cache-Misses).
# Lint: gitleaks HART · clang-format/cppcheck ADVISORY (bis #179), baremetal-hermetisch.

include:
  - project: 'comdare/cluster/ci-templates'
    ref: development
    file: '/base-pipeline.yml'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - lint
  - submodules
  - analyse
  - thesis-pdf

variables:
  GIT_SUBMODULE_STRATEGY: recursive       # zieht cache-engine + prt-art + thesis ueber relative URLs
  GIT_SUBMODULE_FORCE_HTTPS: "true"        # relative URLs -> GitLab-HTTPS + CI_JOB_TOKEN (air-gap)
  CMAKE_BUILD_PARALLEL_LEVEL: "8"
  # Lint nur ueber die Super-eigenen Auswertungswerkzeuge (Code/), NICHT die Submodule unter Code/external/
  COMDARE_LINT_PATHS: "Code"
  COMDARE_LINT_EXCLUDE_RE: "(^|/)(ext|build|_archive_code_pre_migration|cmake-build-[^/]*|modules|external|thesis)/"

# ── Stufe 1: Lint (aus ci-templates, baremetal-hermetisch) ──
lint:secrets:
  extends: .lint-secrets
  tags: [baremetal]
lint:format:
  extends: .lint-format
  tags: [baremetal]
  allow_failure: true
lint:static:
  extends: .lint-static
  tags: [baremetal]
  allow_failure: true

# ── Stage submodules: air-gap-taugliche Submodul-Verdrahtung verifizieren (leichtgewichtig) ──
verify:submodules:
  stage: submodules
  tags: [baremetal]
  needs: []
  script:
    - 'echo "== Submodule =="; git submodule status'
    - 'test -e Code/external/comdare-cache-engine/CMakeLists.txt && echo "cache-engine OK"'
    - 'test -e Code/external/comdare-prt-art/CMakeLists.txt && echo "prt-art OK"'
    - 'test -d thesis/diplomarbeit && (ls thesis/diplomarbeit/*.tex >/dev/null 2>&1 && echo "thesis-LaTeX OK" || echo "thesis vorhanden")'

# ── Stage analyse: Auswertungswerkzeuge bauen + cache-engine-Mess-Artefakte (lose Abhaengigkeit) konsumieren ──
analyse:thesis-data:
  stage: analyse
  tags: [baremetal]
  needs: ["verify:submodules"]
  script:
    - 'echo "== cache-engine-Mess-Artefakte (LOSE externe Abhaengigkeit) holen =="'
    - 'curl -sf -o ce-measure.zip "${CI_API_V4_URL}/projects/comdare%2Fresearch%2Fcomdare-cache-engine/jobs/artifacts/main/download?job=measure:amd" -H "JOB-TOKEN: ${CI_JOB_TOKEN}" && unzip -o -q ce-measure.zip -d ce-measure && echo "-> cache-engine-Mess-Artefakte uebernommen (reale Cache-Misses)" || echo "-> keine frischen cache-engine-Mess-Artefakte (measure:amd) -> baue mit committetem Bestand/Demo"'
    - 'echo "== Toolchain =="; cmake --version; (g++ --version || c++ --version || echo "KEIN C++-Compiler")'
    - cd Code
    - cmake -B build -G Ninja -DCOMDARE_V32_ENABLE=ON -DCMAKE_BUILD_TYPE=Release
    # Build-Parallelität via CMAKE_BUILD_PARALLEL_LEVEL (Runner-Core-Budget), NICHT -j nproc (User 2026-06-25)
    - cmake --build build --target comdare-messung-driver comdare_binary_to_csv comdare_csv_to_latex comdare_diagram_generator
  artifacts:
    paths:
      - Code/build/
    expire_in: 1 day
    when: always

# ── Stage thesis-pdf: Diplomarbeit-PDF mit den Mess-Ergebnissen kompilieren (TeX = Infra-Voraussetzung) ──
thesis:pdf:
  stage: thesis-pdf
  tags: [baremetal]
  needs: ["analyse:thesis-data"]
  script:
    - 'command -v latexmk >/dev/null 2>&1 || command -v pdflatex >/dev/null 2>&1 || { echo "TeX-Toolchain (texlive/latexmk) fehlt auf dem Runner — Infra-Voraussetzung (CE-DL-artig)"; exit 1; }'
    - cd thesis/diplomarbeit
    - 'echo "thesis-Quellen:"; ls *.tex build.* 2>/dev/null | head'
    - 'main=$(grep -lE "\\\\documentclass" *.tex 2>/dev/null | head -1); echo "main-tex=$main"; test -n "$main" && latexmk -pdf -interaction=nonstopmode -halt-on-error "$main"'
  artifacts:
    paths:
      - thesis/diplomarbeit/*.pdf
    when: always
    expire_in: 4 weeks
