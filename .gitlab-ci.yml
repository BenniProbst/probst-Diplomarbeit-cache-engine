# werden MUSS. Der schaerfste (K7/K8) baut ein Wegwerf-ce-Repo mit gewuerfelter Datei- und
# Stellenzahl und verlangt erst Gruen auf genau diese Zahlen, dann Rot bei +1 -- eine Wache, die
