# recursive bleibt stehen) und sonst nichts: kein Compiler, kein ccache, kein Bauverzeichnis.
#
# WARUM DIE PROBE MITFAEHRT (T-1/T-7): eine Wache ueber Zahlen, deren eigene Zahl niemand
# nachrechnet, ist nur eine weitere Zahl ohne Nenner. Die Probe faehrt BEIDE Richtungen: den
