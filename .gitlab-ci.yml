# ── P4c (2026-08-09): REGISTRIERUNGS-WACHE ueber ci/tests/*.sh -- gegen eine Zirkularitaet ──
# DER BEFUND. Jede Probe dieses Repos prueft ihre eigene Registrierung selbst (A7, F11, K9...).
# Das faengt "Probe gebaut, Job vergessen". Es faengt NICHT den Fall, gegen den T-7 gerichtet ist:
# wird der JOB-BLOCK geloescht, laeuft die Probe nicht mehr und kann ihre eigene Abwesenheit nicht
# mehr melden. Eine Wache, die nur aus dem Objekt heraus spricht, das sie bewacht, ist bei dessen
# Entfernung stumm -- rc=0, und die Pipeline sieht gruen aus.
