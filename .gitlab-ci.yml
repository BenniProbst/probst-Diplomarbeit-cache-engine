# ── W0b-8 (2026-08-08): PLAN-ZAHLEN-WACHE + ihre Bissprobe ──
# DER BEFUND. Der TDD-Designplan trug die Zahl "das CSV-Schema wird von 47 von 47 Stellen gegen
# seine eigene Quelle geprueft". Am Objekt war sie mit KEINER von sechs benannten Zaehlweisen
# reproduzierbar (29/35/55/37/84/119 -- keine ergibt 47). Die Sachaussage haelt, die Zahl nicht.
# Zwei weitere Plan-Zahlen desselben Dokuments waren ueberholt: D3-1/D3-2 galten als "NICHT
# GEFUNDEN" und sind seit 7444d8c0 gelandet, und die Divergenz "429 -> 456" war ein Sprung ueber
# ZWEI Grundgesamtheiten (frischer Configure gegen gebauten Baum). Berichtigt in Abschnitt 9 des
# Plans -- annotiert, nichts geloescht.
